<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#020617">
<title>Gastos do Mês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --slate-950: #020617;
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-300: #cbd5e1;
    --indigo-500: #6366f1;
    --indigo-400: #818cf8;
    --indigo-300: #a5b4fc;
    --red-500: #ef4444;
    --red-400: #f87171;
    --green-400: #4ade80;
    --green-500: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: linear-gradient(180deg, var(--slate-950) 0%, var(--slate-900) 60%, var(--slate-800) 130%);
    color: var(--slate-300);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ===================== TOPO / HEADLINE ===================== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: flex-end;
    padding: calc(16px + env(safe-area-inset-top)) 20px 0;
    z-index: 40;
  }
  .btn-restart {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--slate-700);
    background: rgba(30, 41, 59, .7);
    color: var(--slate-400);
    display: grid; place-items: center;
    backdrop-filter: blur(6px);
  }
  .btn-restart:active { color: var(--red-500); border-color: var(--red-500); }

  .headline {
    text-align: center;
    margin-bottom: 26px;
  }
  .headline .hl-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--slate-500);
  }
  .headline .hl-total {
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    margin-top: 4px;
    letter-spacing: -0.02em;
  }
  .headline .hl-total.pos { color: var(--green-400); }
  .headline .hl-total.neg { color: var(--red-400); }

  .month-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--slate-500);
    margin-bottom: 20px;
  }

  /* ===================== GRID ===================== */
  .grid-points {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .grid-cell {
    width: 30px; height: 30px;
    border-radius: 6px;
    background: var(--slate-800);
    border: 1px solid rgba(51, 65, 85, .5);
    position: relative;
    transition: transform .12s ease;
  }
  .grid-cell:active { transform: scale(.9); }
  .grid-cell.today { box-shadow: 0 0 0 1.5px var(--indigo-400); }
  .grid-cell .fill {
    position: absolute; inset: 0;
    border-radius: 5px;
    background: var(--indigo-500);
    opacity: 0;
  }

  .cell-info {
    margin-top: 18px;
    font-size: 12px;
    color: var(--slate-400);
    height: 16px;
    text-align: center;
  }
  .insights {
    margin-top: 10px;
    max-width: 290px;
    text-align: center;
    font-size: 13px;
    line-height: 1.55;
    color: var(--slate-400);
    min-height: 20px;
  }
  .insights strong { color: var(--indigo-300); font-weight: 600; }

  /* ===================== FAB + SLIDE MENU ===================== */
  .fab-zone {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 50;
  }
  .slide-menu {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    opacity: 0;
    transform: translateY(12px) scale(.94);
    transition: opacity .18s ease, transform .18s ease;
    pointer-events: none;
  }
  .slide-menu.open { opacity: 1; transform: translateY(0) scale(1); }

  .slide-opt {
    width: 66px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 4px;
    border-radius: 14px;
    background: rgba(30, 41, 59, .85);
    border: 1px solid var(--slate-700);
    backdrop-filter: blur(8px);
    transition: transform .1s ease, background .1s ease, border-color .1s ease;
  }
  .slide-opt .ic { width: 26px; height: 26px; display: grid; place-items: center; color: var(--slate-400); }
  .slide-opt .lb { font-size: 10px; font-weight: 500; color: var(--slate-400); letter-spacing: .02em; }
  .slide-opt.hot { background: var(--indigo-500); border-color: var(--indigo-400); transform: translateY(-8px) scale(1.08); }
  .slide-opt.hot .ic, .slide-opt.hot .lb { color: #fff; }

  .fab {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: none;
    background: var(--indigo-500);
    color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(99, 102, 241, .45);
    pointer-events: auto;
    touch-action: none;
  }
  .fab:active { background: var(--indigo-400); }
  .fab svg { width: 26px; height: 26px; }

  /* ===================== PÁGINAS ===================== */
  .page {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, var(--slate-950), var(--slate-900));
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    padding: 0 22px calc(40px + env(safe-area-inset-bottom));
  }
  .page.open { display: flex; }

  .page-top {
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, var(--slate-950) 70%, transparent);
    padding: calc(18px + env(safe-area-inset-top)) 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
  }
  .btn-cancel {
    border: 1px solid rgba(239, 68, 68, .5);
    background: rgba(239, 68, 68, .12);
    color: var(--red-500);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
  }
  .btn-cancel:active { background: rgba(239, 68, 68, .25); }
  .page-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--slate-500);
  }

  .field { margin-top: 22px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--slate-500);
    margin-bottom: 8px;
  }
  .field input[type=text],
  .field input[type=tel],
  .field select {
    width: 100%;
    background: var(--slate-800);
    border: 1px solid var(--slate-700);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 16px;
    color: #fff;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus { border-color: var(--indigo-500); }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '';
    position: absolute;
    right: 16px; top: 50%;
    width: 8px; height: 8px;
    border-right: 2px solid var(--slate-500);
    border-bottom: 2px solid var(--slate-500);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  /* input de valor com mask BRL — cor por tipo da operação */
  input.amount { font-weight: 700; letter-spacing: .01em; }
  input.amount.receita { color: var(--green-400); border-color: rgba(74, 222, 128, .45); }
  input.amount.despesa { color: var(--red-400); border-color: rgba(248, 113, 113, .45); }

  .segment {
    display: flex;
    background: var(--slate-800);
    border: 1px solid var(--slate-700);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .segment button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--slate-400);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 0;
    border-radius: 9px;
  }
  .segment button.on-receita { background: rgba(34, 197, 94, .2); color: var(--green-400); }
  .segment button.on-despesa { background: rgba(239, 68, 68, .2); color: var(--red-400); }

  .wallet-scroll { display: flex; flex-wrap: wrap; gap: 8px; }
  .wallet-pick {
    border: 1px solid var(--slate-700);
    background: var(--slate-800);
    color: var(--slate-300);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 12px;
  }
  .wallet-pick.sel {
    background: rgba(99, 102, 241, .18);
    border-color: var(--indigo-500);
    color: var(--indigo-300);
  }

  .btn-save {
    margin-top: 34px;
    width: 100%;
    border: none;
    background: var(--indigo-500);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, .35);
  }
  .btn-save:active { background: var(--indigo-400); }

  /* ===================== CARDS DE TOTAIS (CARTEIRA) ===================== */
  .totals-row { display: flex; gap: 12px; margin-top: 20px; }
  .total-card {
    flex: 1;
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--slate-700);
    background: var(--slate-800);
  }
  .total-card .tc-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .total-card .tc-value { font-size: 19px; font-weight: 800; margin-top: 6px; color: #fff; letter-spacing: -0.01em; }
  .total-card.receitas { border-color: rgba(34, 197, 94, .35); background: rgba(34, 197, 94, .07); }
  .total-card.receitas .tc-label { color: var(--green-400); }
  .total-card.despesas { border-color: rgba(239, 68, 68, .35); background: rgba(239, 68, 68, .07); }
  .total-card.despesas .tc-label { color: var(--red-400); }

  /* listas (operações e fontes) */
  .row-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--slate-800);
    border: 1px solid var(--slate-700);
    border-radius: 14px;
    padding: 13px 14px;
    margin-top: 12px;
  }
  .row-item .r-ic {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .row-item .r-ic.receita { background: rgba(34, 197, 94, .15); color: var(--green-400); }
  .row-item .r-ic.despesa { background: rgba(239, 68, 68, .15); color: var(--red-400); }
  .row-item .r-ic.wallet  { background: rgba(99, 102, 241, .15); color: var(--indigo-400); }
  .row-item .r-body { flex: 1; min-width: 0; }
  .row-item .r-tt { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-item .r-sub { font-size: 12px; color: var(--slate-400); margin-top: 2px; }
  .row-item .r-act {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--slate-700);
    background: transparent;
    color: var(--slate-400);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .row-item .r-act:active { border-color: var(--indigo-500); color: var(--indigo-400); }
  .row-item .r-act.del:active { border-color: var(--red-500); color: var(--red-500); }

  .list-empty { margin-top: 24px; text-align: center; font-size: 13px; color: var(--slate-500); }
  .divider {
    margin: 30px 0 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--slate-500);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(120px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--slate-800);
    border: 1px solid var(--indigo-500);
    color: var(--slate-300);
    font-size: 13px;
    line-height: 1.5;
    padding: 13px 18px;
    border-radius: 14px;
    max-width: 300px;
    text-align: center;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 200;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast strong { color: var(--indigo-300); }
</style>
</head>
<body>

  <!-- ============ TOPO ============ -->
  <div class="topbar">
    <button class="btn-restart" id="btnRestart" aria-label="Resetar sistema">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>

  <!-- ============ TELA PRINCIPAL ============ -->
  <div class="headline">
    <div class="hl-label">Você possui</div>
    <div class="hl-total" id="hlTotal">R$ 0,00</div>
  </div>
  <div class="month-label" id="monthLabel"></div>
  <div class="grid-points" id="gridPoints"></div>
  <div class="cell-info" id="cellInfo"></div>
  <div class="insights" id="insights"></div>

  <!-- ============ FAB + SLIDE MENU ============ -->
  <div class="fab-zone">
    <div class="slide-menu" id="slideMenu">
      <div class="slide-opt" data-act="receita">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
        <div class="lb">Receita</div>
      </div>
      <div class="slide-opt" data-act="despesa">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></div>
        <div class="lb">Despesa</div>
      </div>
      <div class="slide-opt" data-act="operacao">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V8m0 0L4 11m3-3 3 3M17 8v8m0 0 3-3m-3 3-3-3"/></svg></div>
        <div class="lb">Operação</div>
      </div>
      <div class="slide-opt" data-act="carteira">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h.01"/></svg></div>
        <div class="lb">Carteira</div>
      </div>
    </div>
    <button class="fab" id="fab" aria-label="Adicionar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- ============ PÁGINA TRANSAÇÃO ============ -->
  <div class="page" id="pageTx">
    <div class="page-top">
      <button class="btn-cancel" data-close="pageTx">Cancelar</button>
      <div class="page-title" id="txTitle">Transação</div>
      <div style="width:86px"></div>
    </div>

    <div class="field">
      <label>Operação *</label>
      <div class="select-wrap">
        <select id="txOp"></select>
      </div>
    </div>

    <div class="field">
      <label>Descrição</label>
      <input type="text" id="txDesc" placeholder="Ex.: almoço no shopping" autocomplete="off">
    </div>

    <div class="field">
      <label>Valor</label>
      <input type="tel" class="amount" id="txAmount" inputmode="numeric" placeholder="R$ 0,00" autocomplete="off">
    </div>

    <div class="field" id="txWalletField" style="display:none">
      <label>Fonte · Carteira</label>
      <div class="wallet-scroll" id="txWalletList"></div>
    </div>

    <button class="btn-save" id="txSave">Salvar</button>
  </div>

  <!-- ============ PÁGINA OPERAÇÕES ============ -->
  <div class="page" id="pageOps">
    <div class="page-top">
      <button class="btn-cancel" data-close="pageOps">Cancelar</button>
      <div class="page-title">Operações</div>
      <div style="width:86px"></div>
    </div>

    <div class="field">
      <label>Nome da operação</label>
      <input type="text" id="opName" placeholder="Ex.: Mercado, Salário, Transporte" autocomplete="off">
    </div>

    <div class="field">
      <label>Tipo</label>
      <div class="segment">
        <button id="segReceita">Receita</button>
        <button id="segDespesa">Despesa</button>
      </div>
    </div>

    <button class="btn-save" id="opSave">Salvar operação</button>

    <div class="divider">Operações cadastradas</div>
    <div id="opsList"></div>
  </div>

  <!-- ============ PÁGINA CARTEIRA ============ -->
  <div class="page" id="pageWallet">
    <div class="page-top">
      <button class="btn-cancel" data-close="pageWallet">Cancelar</button>
      <div class="page-title">Carteira</div>
      <div style="width:86px"></div>
    </div>

    <div class="totals-row">
      <div class="total-card receitas">
        <div class="tc-label"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg> Receitas</div>
        <div class="tc-value" id="cardReceitas">R$ 0,00</div>
      </div>
      <div class="total-card despesas">
        <div class="tc-label"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14m0 0-6-6m6 6 6-6"/></svg> Despesas</div>
        <div class="tc-value" id="cardDespesas">R$ 0,00</div>
      </div>
    </div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="wTitle" placeholder="Ex.: Salário" autocomplete="off">
    </div>
    <div class="field">
      <label>Valor</label>
      <input type="tel" class="amount" id="wAmount" inputmode="numeric" placeholder="R$ 2.000,00" autocomplete="off">
    </div>
    <button class="btn-save" id="wSave">Adicionar à carteira</button>

    <div class="divider">Fontes cadastradas</div>
    <div id="walletItems"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
'use strict';

/* =================================================================
   CONTEXTO DE DATA — contextCurrentMonth
================================================================= */
const now = new Date();
const ctx = {
  year: now.getFullYear(),
  month: now.getMonth(),
  today: now.getDate(),
  daysInMonth: new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate()
};

const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
document.getElementById('monthLabel').textContent = `${MONTHS[ctx.month]} · ${ctx.year} · ${ctx.daysInMonth} dias`;

/* =================================================================
   MASK BRL — digita só dígitos, formata como moeda (centavos)
================================================================= */
function attachBRLMask(input) {
  input.addEventListener('input', () => {
    const digits = input.value.replace(/\D/g, '').slice(0, 12); // unsigned por natureza
    input.dataset.cents = digits;
    input.value = digits ? BRL.format(Number(digits) / 100) : '';
  });
}
function maskValue(input) {
  return Number(input.dataset.cents || 0) / 100;
}
function clearMask(input) {
  input.value = '';
  input.dataset.cents = '';
}

/* =================================================================
   INDEXEDDB — dados brutos (transações + carteira)
================================================================= */
const DB_NAME = 'cubs-finance';
let db;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('transactions')) {
        const t = d.createObjectStore('transactions', { keyPath: 'id', autoIncrement: true });
        t.createIndex('byDate', 'date');
      }
      if (!d.objectStoreNames.contains('wallet')) {
        d.createObjectStore('wallet', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror = () => rej(req.error);
  });
}
const dbAdd = (store, obj) => new Promise((res, rej) => {
  const tx = db.transaction(store, 'readwrite');
  tx.objectStore(store).add(obj);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
});
const dbAll = store => new Promise((res, rej) => {
  const r = db.transaction(store, 'readonly').objectStore(store).getAll();
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});

/* =================================================================
   LOCALSTORAGE — pré-definições: OPERAÇÕES { id, name, type }
================================================================= */
const OPS = {
  all: () => JSON.parse(localStorage.getItem('cubs.operations') || '[]'),
  save(list) { localStorage.setItem('cubs.operations', JSON.stringify(list)); },
  add(name, type) {
    const list = OPS.all();
    list.push({ id: Date.now(), name, type });
    OPS.save(list);
  },
  update(id, name, type) {
    OPS.save(OPS.all().map(o => o.id === id ? { ...o, name, type } : o));
  },
  remove(id) {
    OPS.save(OPS.all().filter(o => o.id !== id));
  },
  byId: id => OPS.all().find(o => o.id === id)
};

/* =================================================================
   HEADLINE — total que o usuário possui (receitas − despesas)
================================================================= */
async function renderHeadline(all) {
  all = all || await dbAll('transactions');
  let rec = 0, desp = 0;
  for (const t of all) t.type === 'receita' ? rec += t.amount : desp += t.amount;
  const total = rec - desp;
  const el = document.getElementById('hlTotal');
  el.textContent = BRL.format(total);
  el.className = 'hl-total' + (total > 0 ? ' pos' : total < 0 ? ' neg' : '');
  return { rec, desp };
}

/* =================================================================
   GRID POINTS — 1 célula por dia, maxSpendPerDay dinâmico
================================================================= */
const gridEl = document.getElementById('gridPoints');
const cellInfoEl = document.getElementById('cellInfo');
const insightsEl = document.getElementById('insights');
let daySpend = {};

function buildGrid() {
  gridEl.innerHTML = '';
  for (let d = 1; d <= ctx.daysInMonth; d++) {
    const c = document.createElement('div');
    c.className = 'grid-cell' + (d === ctx.today ? ' today' : '');
    c.dataset.day = d;
    c.innerHTML = '<div class="fill"></div>';
    c.addEventListener('click', () => {
      const v = daySpend[d] || 0;
      cellInfoEl.textContent = `Dia ${d} · ${v > 0 ? BRL.format(v) : 'sem gastos'}`;
    });
    gridEl.appendChild(c);
  }
}

async function renderGrid() {
  const all = await dbAll('transactions');
  daySpend = {};
  for (const t of all) {
    const dt = new Date(t.date);
    if (t.type === 'despesa' && dt.getFullYear() === ctx.year && dt.getMonth() === ctx.month) {
      const d = dt.getDate();
      daySpend[d] = (daySpend[d] || 0) + t.amount;
    }
  }
  const maxSpendPerDay = Math.max(0, ...Object.values(daySpend));
  document.querySelectorAll('.grid-cell').forEach(cell => {
    const v = daySpend[+cell.dataset.day] || 0;
    cell.querySelector('.fill').style.opacity =
      (v > 0 && maxSpendPerDay > 0) ? Math.max(0.15, v / maxSpendPerDay).toFixed(2) : 0;
  });
  await renderHeadline(all);
  await renderInsights(all);
}

/* =================================================================
   INSIGHT — dias equivalentes da fonte (carteira)
================================================================= */
async function renderInsights(all) {
  const wallet = await dbAll('wallet');
  if (!wallet.length) { insightsEl.innerHTML = ''; return; }
  const spentByWallet = {};
  for (const t of all) {
    const dt = new Date(t.date);
    if (t.type === 'despesa' && t.walletId && dt.getFullYear() === ctx.year && dt.getMonth() === ctx.month) {
      spentByWallet[t.walletId] = (spentByWallet[t.walletId] || 0) + t.amount;
    }
  }
  const lines = [];
  for (const w of wallet) {
    const spent = spentByWallet[w.id];
    if (!spent) continue;
    const days = spent / (w.amount / ctx.daysInMonth);
    lines.push(`Você gastou o relativo a <strong>${days.toFixed(1)} dias</strong> do seu ${w.title}.`);
  }
  insightsEl.innerHTML = lines.join('<br>');
}

/* =================================================================
   RESTART — apaga IndexedDB + localStorage
================================================================= */
document.getElementById('btnRestart').addEventListener('click', () => {
  if (!confirm('Resetar o sistema? Todos os dados (transações, carteira e operações) serão apagados.')) return;
  localStorage.clear();
  if (db) db.close();
  const req = indexedDB.deleteDatabase(DB_NAME);
  req.onsuccess = req.onerror = req.onblocked = () => location.reload();
});

/* =================================================================
   FAB — slide-select
================================================================= */
const fab = document.getElementById('fab');
const slideMenu = document.getElementById('slideMenu');
const opts = [...slideMenu.querySelectorAll('.slide-opt')];
let sliding = false, hotOpt = null;

function setHot(el) {
  if (hotOpt === el) return;
  opts.forEach(o => o.classList.remove('hot'));
  hotOpt = el;
  if (el) { el.classList.add('hot'); if (navigator.vibrate) navigator.vibrate(8); }
}
function optAtX(x) {
  for (const o of opts) {
    const r = o.getBoundingClientRect();
    if (x >= r.left - 5 && x <= r.right + 5) return o;
  }
  return null;
}
function slideStart() { sliding = true; hotOpt = null; slideMenu.classList.add('open'); }
function slideMove(x) { if (sliding) setHot(optAtX(x)); }
function slideEnd() {
  if (!sliding) return;
  sliding = false;
  slideMenu.classList.remove('open');
  const act = hotOpt ? hotOpt.dataset.act : null;
  setHot(null);
  if (act) runAction(act);
}
fab.addEventListener('touchstart', e => { e.preventDefault(); slideStart(); }, { passive: false });
document.addEventListener('touchmove', e => { if (sliding) { e.preventDefault(); slideMove(e.touches[0].clientX); } }, { passive: false });
document.addEventListener('touchend', slideEnd);
document.addEventListener('touchcancel', slideEnd);
fab.addEventListener('mousedown', e => { e.preventDefault(); slideStart(); });
document.addEventListener('mousemove', e => slideMove(e.clientX));
document.addEventListener('mouseup', slideEnd);

/* =================================================================
   NAVEGAÇÃO
================================================================= */
const pageTx = document.getElementById('pageTx');
const pageOps = document.getElementById('pageOps');
const pageWallet = document.getElementById('pageWallet');
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => document.getElementById(b.dataset.close).classList.remove('open'))
);

function runAction(act) {
  if (act === 'receita')  openTx('receita');
  if (act === 'despesa')  openTx('despesa');
  if (act === 'operacao') openOps();
  if (act === 'carteira') openWallet();
}

/* =================================================================
   TRANSAÇÃO — operação obrigatória via dropdown; valor colorido
================================================================= */
const txTitle = document.getElementById('txTitle');
const txOp = document.getElementById('txOp');
const txDesc = document.getElementById('txDesc');
const txAmount = document.getElementById('txAmount');
const txWalletField = document.getElementById('txWalletField');
const txWalletList = document.getElementById('txWalletList');
attachBRLMask(txAmount);

let txWalletId = null;

async function openTx(filterType) {
  const ops = filterType ? OPS.all().filter(o => o.type === filterType) : OPS.all();
  if (!ops.length) {
    toast(`Nenhuma operação de <strong>${filterType}</strong> cadastrada. Crie uma primeiro.`);
    openOps(filterType);
    return;
  }
  txTitle.textContent = filterType === 'receita' ? 'Nova Receita' : 'Nova Despesa';
  txDesc.value = '';
  clearMask(txAmount);
  txWalletId = null;

  txOp.innerHTML = '<option value="" disabled selected>Selecione a operação…</option>' +
    ops.map(o => `<option value="${o.id}">${o.name} · ${o.type}</option>`).join('');

  await renderTxWallet();
  syncTxType();
  pageTx.classList.add('open');
}

function selectedOp() {
  return txOp.value ? OPS.byId(Number(txOp.value)) : null;
}

/* cor do amount + campo carteira seguem o tipo da operação escolhida */
function syncTxType() {
  const op = selectedOp();
  txAmount.classList.remove('receita', 'despesa');
  if (op) txAmount.classList.add(op.type);
  txWalletField.style.display = (op && op.type === 'despesa' && txWalletList.children.length) ? '' : 'none';
}
txOp.addEventListener('change', syncTxType);

async function renderTxWallet() {
  const wallet = await dbAll('wallet');
  txWalletList.innerHTML = '';
  for (const w of wallet) {
    const b = document.createElement('button');
    b.className = 'wallet-pick';
    b.textContent = `${w.title} · ${BRL.format(w.amount)}`;
    b.addEventListener('click', () => {
      txWalletId = (txWalletId === w.id) ? null : w.id;
      [...txWalletList.children].forEach(c => c.classList.remove('sel'));
      if (txWalletId === w.id) b.classList.add('sel');
    });
    txWalletList.appendChild(b);
  }
}

document.getElementById('txSave').addEventListener('click', async () => {
  const op = selectedOp();
  if (!op) { toast('Escolha uma <strong>operação</strong> para lançar a transação.'); return; }
  const amount = maskValue(txAmount);
  if (!amount) { toast('Informe um valor maior que zero.'); return; }

  const tx = {
    type: op.type,          // tipo vem da operação
    opId: op.id,
    opName: op.name,
    desc: txDesc.value.trim(),
    amount,
    walletId: op.type === 'despesa' ? txWalletId : null,
    date: new Date().toISOString()
  };
  await dbAdd('transactions', tx);
  pageTx.classList.remove('open');
  await renderGrid();

  if (tx.walletId) {
    const wallet = await dbAll('wallet');
    const w = wallet.find(x => x.id === tx.walletId);
    if (w) {
      const days = amount / (w.amount / ctx.daysInMonth);
      toast(`Você gastou o relativo a <strong>${days.toFixed(1)} dias</strong> do seu ${w.title}.`);
      return;
    }
  }
  toast(op.type === 'receita' ? 'Receita salva.' : 'Despesa salva.');
});

/* =================================================================
   OPERAÇÕES — nome + tipo (sem amount), com editar / excluir
================================================================= */
const opName = document.getElementById('opName');
const segReceita = document.getElementById('segReceita');
const segDespesa = document.getElementById('segDespesa');
const opsList = document.getElementById('opsList');
const opSaveBtn = document.getElementById('opSave');

let opType = 'despesa';
let editingOpId = null;

function setOpType(t) {
  opType = t;
  segReceita.className = t === 'receita' ? 'on-receita' : '';
  segDespesa.className = t === 'despesa' ? 'on-despesa' : '';
}
segReceita.addEventListener('click', () => setOpType('receita'));
segDespesa.addEventListener('click', () => setOpType('despesa'));

function openOps(presetType) {
  editingOpId = null;
  opName.value = '';
  opSaveBtn.textContent = 'Salvar operação';
  setOpType(presetType || 'despesa');
  renderOpsList();
  pageOps.classList.add('open');
}

function renderOpsList() {
  const list = OPS.all();
  opsList.innerHTML = list.length ? '' : '<div class="list-empty">Nenhuma operação ainda. Crie a primeira acima.</div>';
  for (const o of list) {
    const div = document.createElement('div');
    div.className = 'row-item';
    div.innerHTML = `
      <div class="r-ic ${o.type}">
        ${o.type === 'receita'
          ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
          : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>'}
      </div>
      <div class="r-body">
        <div class="r-tt">${o.name}</div>
        <div class="r-sub">${o.type === 'receita' ? 'Receita' : 'Despesa'}</div>
      </div>
      <button class="r-act edit" aria-label="Editar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      </button>
      <button class="r-act del" aria-label="Excluir">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>`;
    div.querySelector('.edit').addEventListener('click', () => {
      editingOpId = o.id;
      opName.value = o.name;
      setOpType(o.type);
      opSaveBtn.textContent = 'Atualizar operação';
      pageOps.scrollTo({ top: 0, behavior: 'smooth' });
    });
    div.querySelector('.del').addEventListener('click', () => {
      if (!confirm(`Excluir a operação "${o.name}"? As transações já lançadas serão mantidas.`)) return;
      OPS.remove(o.id);
      if (editingOpId === o.id) { editingOpId = null; opName.value = ''; opSaveBtn.textContent = 'Salvar operação'; }
      renderOpsList();
    });
    opsList.appendChild(div);
  }
}

opSaveBtn.addEventListener('click', () => {
  const name = opName.value.trim();
  if (!name) { toast('Dê um nome para a operação.'); return; }
  if (editingOpId) {
    OPS.update(editingOpId, name, opType);
    toast(`Operação <strong>${name}</strong> atualizada.`);
  } else {
    OPS.add(name, opType);
    toast(`Operação <strong>${name}</strong> criada.`);
  }
  editingOpId = null;
  opName.value = '';
  opSaveBtn.textContent = 'Salvar operação';
  renderOpsList();
});

/* =================================================================
   CARTEIRA — cards de totais + fontes
================================================================= */
const wTitle = document.getElementById('wTitle');
const wAmount = document.getElementById('wAmount');
const walletItems = document.getElementById('walletItems');
attachBRLMask(wAmount);

async function openWallet() {
  wTitle.value = '';
  clearMask(wAmount);
  const { rec, desp } = await renderHeadline();
  document.getElementById('cardReceitas').textContent = BRL.format(rec);
  document.getElementById('cardDespesas').textContent = BRL.format(desp);
  await renderWalletItems();
  pageWallet.classList.add('open');
}

async function renderWalletItems() {
  const wallet = await dbAll('wallet');
  walletItems.innerHTML = wallet.length ? '' : '<div class="list-empty">Nenhuma fonte ainda. Adicione seu salário acima.</div>';
  for (const w of wallet) {
    const div = document.createElement('div');
    div.className = 'row-item';
    div.innerHTML = `
      <div class="r-ic wallet"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h.01"/></svg></div>
      <div class="r-body">
        <div class="r-tt">${w.title}</div>
        <div class="r-sub">${BRL.format(w.amount)} · ${BRL.format(w.amount / ctx.daysInMonth)}/dia</div>
      </div>`;
    walletItems.appendChild(div);
  }
}

document.getElementById('wSave').addEventListener('click', async () => {
  const amount = maskValue(wAmount);
  const title = wTitle.value.trim();
  if (!title || !amount) { toast('Preencha título e valor.'); return; }
  await dbAdd('wallet', { title, amount });
  wTitle.value = '';
  clearMask(wAmount);
  await renderWalletItems();
  await renderGrid();
  toast(`<strong>${title}</strong> adicionado à carteira.`);
});

/* ---------------- toast ---------------- */
let toastTimer;
function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
}

/* =================================================================
   BOOT
================================================================= */
(async () => {
  await openDB();
  buildGrid();
  await renderGrid();
})();
</script>
