<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#020617">
<title>Gastos do Mês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* slate scale — começando 950 e diminuindo */
    --slate-950: #020617;
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-300: #cbd5e1;
    /* indigo (tailwind) */
    --indigo-500: #6366f1;
    --indigo-400: #818cf8;
    --indigo-300: #a5b4fc;
    --red-500: #ef4444;
    --green-400: #4ade80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Noto Sans', sans-serif;
    background: linear-gradient(180deg, var(--slate-950) 0%, var(--slate-900) 60%, var(--slate-800) 130%);
    color: var(--slate-300);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ===================== TELA PRINCIPAL ===================== */
  .month-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--slate-500);
    margin-bottom: 20px;
  }

  .grid-points {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .grid-cell {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: var(--slate-800);
    border: 1px solid rgba(51, 65, 85, .5);
    position: relative;
    transition: transform .12s ease;
  }
  .grid-cell:active { transform: scale(.9); }
  .grid-cell.today { box-shadow: 0 0 0 1.5px var(--indigo-400); }
  .grid-cell .fill {
    position: absolute;
    inset: 0;
    border-radius: 5px;
    background: var(--indigo-500);
    opacity: 0;
  }

  .cell-info {
    margin-top: 18px;
    font-size: 12px;
    color: var(--slate-400);
    height: 16px;
    text-align: center;
  }

  .insights {
    margin-top: 10px;
    max-width: 290px;
    text-align: center;
    font-size: 13px;
    line-height: 1.55;
    color: var(--slate-400);
    min-height: 20px;
  }
  .insights strong { color: var(--indigo-300); font-weight: 600; }

  /* ===================== FAB + SLIDE MENU ===================== */
  .fab-zone {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 50;
  }

  .slide-menu {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    opacity: 0;
    transform: translateY(12px) scale(.94);
    transition: opacity .18s ease, transform .18s ease;
    pointer-events: none;
  }
  .slide-menu.open {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .slide-opt {
    width: 66px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 4px;
    border-radius: 14px;
    background: rgba(30, 41, 59, .85);
    border: 1px solid var(--slate-700);
    backdrop-filter: blur(8px);
    transition: transform .1s ease, background .1s ease, border-color .1s ease;
  }
  .slide-opt .ic {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    color: var(--slate-400);
  }
  .slide-opt .lb {
    font-size: 10px;
    font-weight: 500;
    color: var(--slate-400);
    letter-spacing: .02em;
  }
  .slide-opt.hot {
    background: var(--indigo-500);
    border-color: var(--indigo-400);
    transform: translateY(-8px) scale(1.08);
  }
  .slide-opt.hot .ic, .slide-opt.hot .lb { color: #fff; }

  .fab {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    background: var(--indigo-500);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 24px rgba(99, 102, 241, .45);
    pointer-events: auto;
    touch-action: none;
  }
  .fab:active { background: var(--indigo-400); }
  .fab svg { width: 26px; height: 26px; }

  /* ===================== PÁGINAS FULL (Operação / Carteira) ===================== */
  .page {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, var(--slate-950), var(--slate-900));
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    padding: 0 22px calc(40px + env(safe-area-inset-bottom));
  }
  .page.open { display: flex; }

  .page-top {
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, var(--slate-950) 70%, transparent);
    padding: calc(18px + env(safe-area-inset-top)) 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
  }
  .btn-cancel {
    border: 1px solid rgba(239, 68, 68, .5);
    background: rgba(239, 68, 68, .12);
    color: var(--red-500);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
  }
  .btn-cancel:active { background: rgba(239, 68, 68, .25); }
  .page-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--slate-500);
  }

  .field { margin-top: 22px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--slate-500);
    margin-bottom: 8px;
  }
  .field input[type=text],
  .field input[type=tel] {
    width: 100%;
    background: var(--slate-800);
    border: 1px solid var(--slate-700);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 16px;
    color: #fff;
    outline: none;
  }
  .field input:focus { border-color: var(--indigo-500); }

  /* segment receita/despesa */
  .segment {
    display: flex;
    background: var(--slate-800);
    border: 1px solid var(--slate-700);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .segment button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--slate-400);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 0;
    border-radius: 9px;
  }
  .segment button.on { background: var(--indigo-500); color: #fff; }

  /* scroll list de #tags */
  .tag-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 2px 4px;
    scrollbar-width: none;
  }
  .tag-scroll::-webkit-scrollbar { display: none; }
  .tag-chip {
    flex-shrink: 0;
    border: 1px solid var(--slate-700);
    background: var(--slate-800);
    color: var(--indigo-300);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
  }
  .tag-chip:active, .tag-chip.sel {
    background: var(--indigo-500);
    border-color: var(--indigo-400);
    color: #fff;
  }

  /* select de carteira */
  .wallet-scroll { display: flex; flex-wrap: wrap; gap: 8px; }
  .wallet-pick {
    border: 1px solid var(--slate-700);
    background: var(--slate-800);
    color: var(--slate-300);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 12px;
  }
  .wallet-pick.sel {
    background: rgba(99, 102, 241, .18);
    border-color: var(--indigo-500);
    color: var(--indigo-300);
  }

  .btn-save {
    margin-top: 34px;
    width: 100%;
    border: none;
    background: var(--indigo-500);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, .35);
  }
  .btn-save:active { background: var(--indigo-400); }
  .btn-save:disabled { opacity: .4; box-shadow: none; }

  /* carteira lista */
  .wallet-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--slate-800);
    border: 1px solid var(--slate-700);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .wallet-item .w-ic {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(99, 102, 241, .15);
    color: var(--indigo-400);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .wallet-item .w-tt { font-size: 15px; font-weight: 600; color: #fff; }
  .wallet-item .w-am { font-size: 13px; color: var(--slate-400); margin-top: 2px; }
  .wallet-empty {
    margin-top: 26px;
    text-align: center;
    font-size: 13px;
    color: var(--slate-500);
  }
  .divider {
    margin: 30px 0 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--slate-500);
  }

  /* toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(120px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--slate-800);
    border: 1px solid var(--indigo-500);
    color: var(--slate-300);
    font-size: 13px;
    line-height: 1.5;
    padding: 13px 18px;
    border-radius: 14px;
    max-width: 300px;
    text-align: center;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 200;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast strong { color: var(--indigo-300); }
</style>
</head>
<body>

  <!-- ============ TELA PRINCIPAL ============ -->
  <div class="month-label" id="monthLabel"></div>
  <div class="grid-points" id="gridPoints"></div>
  <div class="cell-info" id="cellInfo"></div>
  <div class="insights" id="insights"></div>

  <!-- ============ FAB + SLIDE MENU ============ -->
  <div class="fab-zone">
    <div class="slide-menu" id="slideMenu">
      <div class="slide-opt" data-act="receita">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
        <div class="lb">Receita</div>
      </div>
      <div class="slide-opt" data-act="despesa">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></div>
        <div class="lb">Despesa</div>
      </div>
      <div class="slide-opt" data-act="operacao">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V8m0 0L4 11m3-3 3 3M17 8v8m0 0 3-3m-3 3-3-3"/></svg></div>
        <div class="lb">Operação</div>
      </div>
      <div class="slide-opt" data-act="carteira">
        <div class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h.01"/></svg></div>
        <div class="lb">Carteira</div>
      </div>
    </div>
    <button class="fab" id="fab" aria-label="Adicionar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- ============ PÁGINA OPERAÇÃO ============ -->
  <div class="page" id="pageOp">
    <div class="page-top">
      <button class="btn-cancel" data-close="pageOp">Cancelar</button>
      <div class="page-title" id="opTitle">Operação</div>
      <div style="width:86px"></div>
    </div>

    <div class="field" id="opTypeField">
      <label>Tipo</label>
      <div class="segment">
        <button id="segReceita">Receita</button>
        <button id="segDespesa">Despesa</button>
      </div>
    </div>

    <div class="field">
      <label>Descrição</label>
      <input type="text" id="opDesc" placeholder="Ex.: almoço no shopping" autocomplete="off">
    </div>

    <div class="field">
      <label># Categoria</label>
      <input type="text" id="opTag" placeholder="#mercado" autocomplete="off">
      <div class="tag-scroll" id="tagList"></div>
    </div>

    <div class="field">
      <label>Valor (R$)</label>
      <input type="tel" id="opAmount" inputmode="decimal" placeholder="0,00" autocomplete="off">
    </div>

    <div class="field" id="opWalletField" style="display:none">
      <label>Fonte · Carteira</label>
      <div class="wallet-scroll" id="opWalletList"></div>
    </div>

    <button class="btn-save" id="opSave">Salvar</button>
  </div>

  <!-- ============ PÁGINA CARTEIRA ============ -->
  <div class="page" id="pageWallet">
    <div class="page-top">
      <button class="btn-cancel" data-close="pageWallet">Cancelar</button>
      <div class="page-title">Carteira</div>
      <div style="width:86px"></div>
    </div>

    <div class="field">
      <label>Título</label>
      <input type="text" id="wTitle" placeholder="Ex.: Salário" autocomplete="off">
    </div>
    <div class="field">
      <label>Valor (R$)</label>
      <input type="tel" id="wAmount" inputmode="decimal" placeholder="2000,00" autocomplete="off">
    </div>
    <button class="btn-save" id="wSave">Adicionar à carteira</button>

    <div class="divider">Fontes cadastradas</div>
    <div id="walletItems"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
'use strict';

/* =================================================================
   CONTEXTO DE DATA — contextCurrentMonth
================================================================= */
const now = new Date();
const ctx = {
  year: now.getFullYear(),
  month: now.getMonth(),                                        // 0-based
  today: now.getDate(),
  daysInMonth: new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate()
};

const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
document.getElementById('monthLabel').textContent = `${MONTHS[ctx.month]} · ${ctx.year} · ${ctx.daysInMonth} dias`;

/* =================================================================
   INDEXEDDB — dados brutos (transações + carteira)
================================================================= */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('cubs-finance', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('transactions')) {
        const t = d.createObjectStore('transactions', { keyPath: 'id', autoIncrement: true });
        t.createIndex('byDate', 'date');
      }
      if (!d.objectStoreNames.contains('wallet')) {
        d.createObjectStore('wallet', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror = () => rej(req.error);
  });
}
function dbAdd(store, obj) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).add(obj);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
function dbAll(store) {
  return new Promise((res, rej) => {
    const req = db.transaction(store, 'readonly').objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

/* =================================================================
   LOCALSTORAGE — pré-definições / state (#tags e tipo por tag)
================================================================= */
const LS = {
  getTags: () => JSON.parse(localStorage.getItem('cubs.tags') || '[]'),
  saveTag(tag) {
    const tags = LS.getTags();
    if (!tags.includes(tag)) { tags.unshift(tag); localStorage.setItem('cubs.tags', JSON.stringify(tags)); }
  },
  getTagTypes: () => JSON.parse(localStorage.getItem('cubs.tagTypes') || '{}'),
  saveTagType(tag, type) {
    const m = LS.getTagTypes(); m[tag] = type;
    localStorage.setItem('cubs.tagTypes', JSON.stringify(m));
  }
};

/* =================================================================
   GRID POINTS — 1 célula por dia do mês corrente
   maxSpendPerDay dinâmico: o maior gasto diário = 100% de opacidade
================================================================= */
const gridEl = document.getElementById('gridPoints');
const cellInfoEl = document.getElementById('cellInfo');
const insightsEl = document.getElementById('insights');

function buildGrid() {
  gridEl.innerHTML = '';
  for (let d = 1; d <= ctx.daysInMonth; d++) {
    const c = document.createElement('div');
    c.className = 'grid-cell' + (d === ctx.today ? ' today' : '');
    c.dataset.day = d;
    c.innerHTML = '<div class="fill"></div>';
    c.addEventListener('click', () => showCellInfo(d));
    gridEl.appendChild(c);
  }
}

let daySpend = {};  // { dia: total de despesas }

async function renderGrid() {
  const all = await dbAll('transactions');
  daySpend = {};
  for (const t of all) {
    const dt = new Date(t.date);
    if (t.type === 'despesa' && dt.getFullYear() === ctx.year && dt.getMonth() === ctx.month) {
      const d = dt.getDate();
      daySpend[d] = (daySpend[d] || 0) + t.amount;
    }
  }
  const maxSpendPerDay = Math.max(0, ...Object.values(daySpend));

  document.querySelectorAll('.grid-cell').forEach(cell => {
    const d = +cell.dataset.day;
    const v = daySpend[d] || 0;
    const fill = cell.querySelector('.fill');
    fill.style.opacity = (v > 0 && maxSpendPerDay > 0)
      ? Math.max(0.15, v / maxSpendPerDay).toFixed(2)
      : 0;
  });

  renderInsights(all);
}

function showCellInfo(d) {
  const v = daySpend[d] || 0;
  cellInfoEl.textContent = `Dia ${d} · ${v > 0 ? BRL.format(v) : 'sem gastos'}`;
}

/* =================================================================
   INSIGHT — "você gastou o relativo a N dias do seu Salário"
   valor/dia da fonte = amount / diasDoMês
================================================================= */
async function renderInsights(all) {
  const wallet = await dbAll('wallet');
  if (!wallet.length) { insightsEl.innerHTML = ''; return; }

  const spentByWallet = {};
  for (const t of all) {
    const dt = new Date(t.date);
    if (t.type === 'despesa' && t.walletId && dt.getFullYear() === ctx.year && dt.getMonth() === ctx.month) {
      spentByWallet[t.walletId] = (spentByWallet[t.walletId] || 0) + t.amount;
    }
  }

  const lines = [];
  for (const w of wallet) {
    const spent = spentByWallet[w.id];
    if (!spent) continue;
    const perDay = w.amount / ctx.daysInMonth;
    const days = spent / perDay;
    lines.push(`Você gastou o relativo a <strong>${days.toFixed(1)} dias</strong> do seu ${w.title}.`);
  }
  insightsEl.innerHTML = lines.join('<br>');
}

/* =================================================================
   FAB — slide-select: segura, desliza entre opções, solta pra escolher
================================================================= */
const fab = document.getElementById('fab');
const slideMenu = document.getElementById('slideMenu');
const opts = [...slideMenu.querySelectorAll('.slide-opt')];
let sliding = false;
let hotOpt = null;

function setHot(el) {
  if (hotOpt === el) return;
  opts.forEach(o => o.classList.remove('hot'));
  hotOpt = el;
  if (el) { el.classList.add('hot'); if (navigator.vibrate) navigator.vibrate(8); }
}

function optAtX(x) {
  for (const o of opts) {
    const r = o.getBoundingClientRect();
    if (x >= r.left - 5 && x <= r.right + 5) return o;
  }
  return null;
}

function slideStart() {
  sliding = true;
  hotOpt = null;
  slideMenu.classList.add('open');
}
function slideMove(x) {
  if (!sliding) return;
  setHot(optAtX(x));
}
function slideEnd() {
  if (!sliding) return;
  sliding = false;
  slideMenu.classList.remove('open');
  const act = hotOpt ? hotOpt.dataset.act : null;
  setHot(null);
  if (act) runAction(act);
}

fab.addEventListener('touchstart', e => { e.preventDefault(); slideStart(); }, { passive: false });
document.addEventListener('touchmove', e => { if (sliding) { e.preventDefault(); slideMove(e.touches[0].clientX); } }, { passive: false });
document.addEventListener('touchend', slideEnd);
document.addEventListener('touchcancel', slideEnd);
/* fallback mouse (teste em desktop) */
fab.addEventListener('mousedown', e => { e.preventDefault(); slideStart(); });
document.addEventListener('mousemove', e => slideMove(e.clientX));
document.addEventListener('mouseup', slideEnd);

/* =================================================================
   PÁGINAS
================================================================= */
const pageOp = document.getElementById('pageOp');
const pageWallet = document.getElementById('pageWallet');
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => document.getElementById(b.dataset.close).classList.remove('open'))
);

function runAction(act) {
  if (act === 'receita')  openOperation('receita', true);
  if (act === 'despesa')  openOperation('despesa', true);
  if (act === 'operacao') openOperation('despesa', false);
  if (act === 'carteira') openWallet();
}

/* ---------------- Operação ---------------- */
const opTitle = document.getElementById('opTitle');
const opTypeField = document.getElementById('opTypeField');
const segReceita = document.getElementById('segReceita');
const segDespesa = document.getElementById('segDespesa');
const opDesc = document.getElementById('opDesc');
const opTag = document.getElementById('opTag');
const opAmount = document.getElementById('opAmount');
const tagListEl = document.getElementById('tagList');
const opWalletField = document.getElementById('opWalletField');
const opWalletList = document.getElementById('opWalletList');

let opType = 'despesa';
let opWalletId = null;

function setOpType(t) {
  opType = t;
  segReceita.classList.toggle('on', t === 'receita');
  segDespesa.classList.toggle('on', t === 'despesa');
  opWalletField.style.display = (t === 'despesa' && opWalletList.children.length) ? '' : 'none';
}
segReceita.addEventListener('click', () => setOpType('receita'));
segDespesa.addEventListener('click', () => setOpType('despesa'));

async function openOperation(type, lockType) {
  opDesc.value = ''; opTag.value = ''; opAmount.value = '';
  opWalletId = null;
  opTitle.textContent = lockType ? (type === 'receita' ? 'Nova Receita' : 'Nova Despesa') : 'Operação';
  opTypeField.style.display = lockType ? 'none' : '';
  renderTagList('');
  await renderOpWallet();
  setOpType(type);
  pageOp.classList.add('open');
}

/* ScrollList de #tags — filtra conforme digita (localStorage) */
function renderTagList(filter) {
  const q = filter.replace(/^#/, '').toLowerCase();
  const tags = LS.getTags().filter(t => t.toLowerCase().includes(q));
  tagListEl.innerHTML = '';
  for (const t of tags) {
    const b = document.createElement('button');
    b.className = 'tag-chip' + (opTag.value.replace(/^#/, '') === t ? ' sel' : '');
    b.textContent = '#' + t;
    b.addEventListener('click', () => { opTag.value = '#' + t; renderTagList(''); });
    tagListEl.appendChild(b);
  }
}
opTag.addEventListener('input', () => renderTagList(opTag.value));

/* valor unsigned — bloqueia negativo */
opAmount.addEventListener('input', () => {
  opAmount.value = opAmount.value.replace(/[^0-9,\.]/g, '');
});
function parseAmount(v) {
  const n = parseFloat(v.replace(/\./g, '').replace(',', '.'));
  return isNaN(n) || n < 0 ? 0 : n;
}

async function renderOpWallet() {
  const wallet = await dbAll('wallet');
  opWalletList.innerHTML = '';
  for (const w of wallet) {
    const b = document.createElement('button');
    b.className = 'wallet-pick';
    b.textContent = `${w.title} · ${BRL.format(w.amount)}`;
    b.addEventListener('click', () => {
      opWalletId = (opWalletId === w.id) ? null : w.id;
      [...opWalletList.children].forEach(c => c.classList.remove('sel'));
      if (opWalletId === w.id) b.classList.add('sel');
    });
    opWalletList.appendChild(b);
  }
}

document.getElementById('opSave').addEventListener('click', async () => {
  const amount = parseAmount(opAmount.value);
  const tag = opTag.value.replace(/^#/, '').trim().toLowerCase();
  if (!amount) { toast('Informe um valor maior que zero.'); return; }

  if (tag) { LS.saveTag(tag); LS.saveTagType(tag, opType); }  // pré-definição no localStorage

  const tx = {
    type: opType,
    desc: opDesc.value.trim(),
    tag,
    amount,
    walletId: opType === 'despesa' ? opWalletId : null,
    date: new Date().toISOString()
  };
  await dbAdd('transactions', tx);
  pageOp.classList.remove('open');
  await renderGrid();

  if (tx.walletId) {
    const wallet = await dbAll('wallet');
    const w = wallet.find(x => x.id === tx.walletId);
    if (w) {
      const days = amount / (w.amount / ctx.daysInMonth);
      toast(`Você gastou o relativo a <strong>${days.toFixed(1)} dias</strong> do seu ${w.title}.`);
      return;
    }
  }
  toast(tx.type === 'receita' ? 'Receita salva.' : 'Despesa salva.');
});

/* ---------------- Carteira ---------------- */
const wTitle = document.getElementById('wTitle');
const wAmount = document.getElementById('wAmount');
const walletItems = document.getElementById('walletItems');

wAmount.addEventListener('input', () => {
  wAmount.value = wAmount.value.replace(/[^0-9,\.]/g, '');
});

async function openWallet() {
  wTitle.value = ''; wAmount.value = '';
  await renderWalletItems();
  pageWallet.classList.add('open');
}

async function renderWalletItems() {
  const wallet = await dbAll('wallet');
  walletItems.innerHTML = wallet.length ? '' : '<div class="wallet-empty">Nenhuma fonte ainda. Adicione seu salário acima.</div>';
  for (const w of wallet) {
    const div = document.createElement('div');
    div.className = 'wallet-item';
    div.innerHTML = `
      <div class="w-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h.01"/></svg></div>
      <div><div class="w-tt">${w.title}</div><div class="w-am">${BRL.format(w.amount)} · ${BRL.format(w.amount / ctx.daysInMonth)}/dia</div></div>`;
    walletItems.appendChild(div);
  }
}

document.getElementById('wSave').addEventListener('click', async () => {
  const amount = parseAmount(wAmount.value);
  const title = wTitle.value.trim();
  if (!title || !amount) { toast('Preencha título e valor.'); return; }
  await dbAdd('wallet', { title, amount });
  wTitle.value = ''; wAmount.value = '';
  await renderWalletItems();
  await renderGrid();
  toast(`<strong>${title}</strong> adicionado à carteira.`);
});

/* ---------------- toast ---------------- */
let toastTimer;
function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
}

/* =================================================================
   BOOT
================================================================= */
(async () => {
  await openDB();
  buildGrid();
  await renderGrid();
})();
</script>
</body>
</html>
