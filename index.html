<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cub's | DataView</title>
    <script>
        /* aplica o tema salvo ANTES do primeiro paint — evita FOUC e a transição de cor presa na troca light→dark */
        try { var _s = JSON.parse(localStorage.getItem('cubs.dataview.v2')); if (_s && _s.ui && _s.ui.theme) document.documentElement.setAttribute('data-theme', _s.ui.theme); } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           PALETA BASE (Tailwind 300–500)
        ============================================================ */
        :root {
            --rose-300:#fda4af;   --rose-400:#fb7185;   --rose-500:#f43f5e;
            --sky-300:#7dd3fc;    --sky-400:#38bdf8;    --sky-500:#0ea5e9;
            --emerald-300:#6ee7b7;--emerald-400:#34d399;--emerald-500:#10b981;
            --yellow-300:#fde047; --yellow-400:#facc15; --yellow-500:#eab308;
            --orange-300:#fdba74; --orange-400:#fb923c; --orange-500:#f97316;
            --indigo-300:#a5b4fc; --indigo-400:#818cf8; --indigo-500:#6366f1;

            --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
            --slate-400:#94a3b8; --slate-500:#64748b; --slate-700:#334155;
            --slate-800:#1e293b; --slate-900:#0f172a; --slate-950:#020617;

            --c-red-500:var(--rose-500);       --c-red-400:var(--rose-400);
            --c-blue-500:var(--sky-500);       --c-blue-400:var(--sky-400);
            --c-green-500:var(--emerald-500);  --c-green-400:var(--emerald-400);
            --c-yellow-500:var(--yellow-500);  --c-yellow-400:var(--yellow-400);
            --c-orange-500:var(--orange-500);  --c-orange-400:var(--orange-400);
            --c-purple-500:var(--indigo-500);  --c-purple-400:var(--indigo-400);
            --c-grey-500:var(--slate-500);     --c-grey-400:var(--slate-400);

            --accent-300:var(--indigo-300);
            --accent-400:var(--indigo-400);
            --accent-500:var(--indigo-500);

            --radius:8px; --radius-sm:5px; --transition:.16s ease;
        }

        /* Tema claro */
        :root, [data-theme="light"] {
            --bg:        var(--slate-100);
            --surface:   #ffffff;
            --secondary: var(--slate-300);
            --border:    var(--slate-400);
            --text:      var(--slate-900);
            --text-muted:var(--slate-500);
            --chip-bg-mix:16%;
            --chip-bd-mix:34%;
        }
        /* Tema escuro */
        [data-theme="dark"] {
            --bg:        var(--slate-950);
            --surface:   var(--slate-900);
            --secondary: var(--slate-800);
            --border:    var(--slate-700);
            --text:      var(--slate-100);
            --text-muted:var(--slate-400);
            --chip-bg-mix:30%;
            --chip-bd-mix:48%;
        }
        :root {
            --grid: color-mix(in srgb, var(--border) 60%, transparent);
            --glow:
                0 0 0 1px color-mix(in srgb, var(--accent-500) 55%, transparent),
                0 8px 22px -10px color-mix(in srgb, var(--accent-500) 75%, transparent);
        }

        * { box-sizing: border-box; }
        * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--border) 88%, transparent) transparent; }
        ::-webkit-scrollbar { width: 11px; height: 11px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--border) 88%, transparent); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); border: 3px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-corner { background: transparent; }
        html, body { height: 100%; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: row;
            height: 100vh; overflow: hidden;          /* body não rola: as views são as regiões de scroll */
            transition: background-color var(--transition), color var(--transition);
        }

        /* ---------- Sidebar ---------- */
        .sidebar { flex: 0 0 auto; width: 214px; display: flex; flex-direction: column; gap: 6px; padding: 12px; margin: 9px 0 9px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 10px 30px -14px rgba(0,0,0,.5); transition: width .24s cubic-bezier(.2,.8,.3,1); overflow: visible; }
        [data-theme="dark"] .sidebar { background: color-mix(in srgb, var(--slate-900) 82%, #000); }
        .sidebar.collapsed { width: 64px; }
        .sb-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; }
        .sidebar.collapsed .sb-head { flex-direction: column; gap: 10px; }
        .sb-toggle { flex: 0 0 auto; width: 32px; height: 32px; display: grid; place-items: center; background: transparent; border: none; border-radius: 8px; color: var(--text-muted); cursor: pointer; transition: background var(--transition), color var(--transition); }
        .sb-toggle:hover { background: var(--secondary); color: var(--text); }
        .sb-toggle svg { width: 20px; height: 20px; transition: transform .24s cubic-bezier(.2,.8,.3,1); }
        .sidebar.collapsed .sb-toggle svg { transform: rotate(180deg); }
        .sb-logo { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; background: var(--accent-500); display: grid; place-items: center; box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent-500) 75%, transparent); }
        .sb-logo img { width: 25px; height: 25px; object-fit: contain; filter: brightness(0) invert(1); }
        .sb-nav { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
        .sb-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: none; background: transparent; border-radius: 10px; color: var(--text); font: inherit; font-size: .88rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background var(--transition), color var(--transition); }
        .sb-item svg { flex: 0 0 auto; width: 20px; height: 20px; }
        .sb-item:hover:not(.disabled) { background: var(--secondary); }
        .sb-item.active { background: color-mix(in srgb, var(--accent-400) 16%, transparent); color: var(--accent-500); }
        .sb-item.disabled { opacity: .4; cursor: not-allowed; }
        .sidebar.collapsed .sb-item { justify-content: center; gap: 0; padding: 9px 0; }
        .sb-label { transition: opacity .16s ease; }
        .sidebar.collapsed .sb-label { display: none; }
        .sb-spacer { flex: 1 1 auto; }
        .sb-bottom { position: relative; flex: 0 0 auto; }
        .sb-avatar { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: none; background: transparent; border-radius: 10px; cursor: pointer; color: var(--text); font: inherit; transition: background var(--transition); }
        .sb-avatar:hover { background: var(--secondary); }
        .sidebar.collapsed .sb-avatar { justify-content: center; gap: 0; padding: 7px 0; }
        .avatar { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-500) 22%, var(--secondary)); color: var(--accent-500); font-size: .78rem; font-weight: 700; }
        .sb-avatar .sb-label { font-size: .85rem; font-weight: 600; }
        .avatar-menu { position: absolute; left: 4px; bottom: calc(100% + 8px); width: 226px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 38px -14px rgba(0,0,0,.5); padding: 6px; display: none; flex-direction: column; gap: 2px; z-index: 120; }
        .avatar-menu.active { display: flex; }
        .sidebar.collapsed .avatar-menu { left: 58px; width: 210px; }
        .am-row { display: flex; align-items: center; gap: 8px; padding: 8px 9px; font-size: .82rem; color: var(--text); }
        .am-row select { margin-left: auto; background: var(--secondary); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: .78rem; cursor: pointer; outline: none; }
        .am-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 9px; border: none; background: transparent; border-radius: 8px; color: var(--text); font: inherit; font-size: .82rem; text-align: left; cursor: pointer; }
        .am-item:hover { background: var(--secondary); }
        .am-item.danger { color: var(--rose-500); }
        .am-sep { height: 1px; background: var(--grid); margin: 4px 2px; }

        /* ---------- Main / topbar / tabs ---------- */
        .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
        .topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
        .top-back { flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-muted); cursor: pointer; transition: background var(--transition), color var(--transition); }
        .top-back:hover:not(:disabled) { background: var(--secondary); color: var(--text); }
        .top-back:disabled { opacity: .35; cursor: default; }
        .top-back svg { width: 20px; height: 20px; }
        .searchbar { flex: 1 1 auto; max-width: 460px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 11px; color: var(--text-muted); transition: border-color var(--transition), box-shadow var(--transition); }
        .searchbar:focus-within { border-color: var(--accent-400); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-400) 24%, transparent); }
        .searchbar svg { flex: 0 0 auto; width: 16px; height: 16px; }
        .searchbar input { flex: 1 1 auto; border: none; background: transparent; color: var(--text); font: inherit; font-size: .86rem; outline: none; }
        .workspace-name { margin-left: auto; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 9px; background: transparent; border: none; color: var(--text-muted); font: inherit; font-size: .86rem; font-weight: 600; cursor: pointer; transition: background var(--transition), color var(--transition); }
        .workspace-name:hover { background: var(--secondary); color: var(--text); }
        .workspace-name svg { flex: 0 0 auto; width: 17px; height: 17px; }
        .tabstrip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: transparent; }
        .tab { display: flex; align-items: center; gap: 8px; max-width: 210px; padding: 7px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text-muted); font-size: .82rem; font-weight: 500; cursor: pointer; transition: background var(--transition), color var(--transition), border-color var(--transition); }
        .tab .tab-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .tab .tab-name-input { border: none; background: transparent; color: inherit; font: inherit; outline: none; max-width: 150px; }
        .tab.active { color: var(--text); font-weight: 600; border-color: color-mix(in srgb, var(--accent-400) 55%, var(--border)); }
        .tab:not(.active):hover { color: var(--text); border-color: color-mix(in srgb, var(--accent-400) 30%, var(--border)); }
        .tab-ico { flex: 0 0 auto; display: flex; opacity: .8; }
        .tab-ico svg { width: 14px; height: 14px; }
        .tab-close { flex: 0 0 auto; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--text-muted); font-size: .9rem; line-height: 1; }
        .tab-close:hover { background: var(--secondary); color: var(--rose-500); }
        .tab-add { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; background: transparent; border: none; border-radius: 8px; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; transition: background var(--transition), color var(--transition); }
        .tab-add:hover { background: var(--surface); color: var(--accent-500); }
        .workspace { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }

        /* ---------- Toolbar ---------- */
        .toolbar {
            flex: 0 0 auto; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 8px 14px; background: var(--bg);
        }
        .toolbar-left { display: flex; align-items: center; gap: 10px; }
        .toolbar-right { display: flex; gap: 6px; align-items: center; position: relative; flex-wrap: wrap; justify-content: flex-end; }

        /* seletor de visão */
        .view-tabs { display: flex; gap: 2px; background: var(--secondary); padding: 3px; border-radius: 9px; }
        .view-tab {
            border: none; background: transparent; color: var(--text-muted);
            font-size: .82rem; font-weight: 600; padding: 5px 13px; border-radius: 6px;
            cursor: pointer; transition: background var(--transition), color var(--transition), box-shadow var(--transition);
        }
        .view-tab:hover { color: var(--text); }
        .view-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

        .btn {
            background: transparent; border: 1px solid transparent;
            padding: 6px 10px; border-radius: 6px;
            color: var(--text-muted); font-size: .85rem; font-weight: 500;
            cursor: pointer; outline: none;
            transition: background var(--transition), color var(--transition), box-shadow var(--transition), border-color var(--transition);
        }
        .btn:hover, .btn:focus-visible {
            background: var(--secondary); color: var(--text);
            border-color: var(--accent-400); box-shadow: var(--glow);
        }
        .icon-btn { padding: 6px 8px; line-height: 1; }

        .kanban-groupby {
            background: var(--secondary); border: 1px solid var(--border); color: var(--text);
            padding: 6px 9px; border-radius: 6px; font-size: .82rem; font-weight: 500; cursor: pointer; outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .kanban-groupby:focus { border-color: var(--accent-400); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-400) 28%, transparent); }

        /* ---------- Popovers ---------- */
        .popover {
            position: absolute; top: 42px; right: 0;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px;
            box-shadow: 0 14px 34px -12px rgba(0,0,0,.4);
            display: none; flex-direction: column; gap: 10px;
            z-index: 60; min-width: 300px; max-width: 92vw;
        }
        .popover.active { display: flex; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: .74rem; color: var(--text-muted); }
        .field input, .field select, .filter-rule select, .filter-rule input {
            background: var(--secondary); border: 1px solid var(--border); color: var(--text);
            padding: 7px 9px; border-radius: 6px; font-size: .85rem; outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .field input:focus, .field select:focus, .filter-rule select:focus, .filter-rule input:focus {
            border-color: var(--accent-400);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-400) 28%, transparent);
        }
        .btn-primary {
            background: var(--accent-500); color: #fff; border: none;
            padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: .85rem; cursor: pointer;
            transition: box-shadow var(--transition), filter var(--transition);
        }
        .btn-primary:hover { box-shadow: var(--glow); filter: brightness(1.05); }
        /* atalho roxo na toolbar */
        .btn-newpage { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; }
        .btn-newpage .plus { font-size: 1.05rem; line-height: 1; margin-top: -1px; }

        .filter-rule { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .filter-label { font-size: .82rem; color: var(--text-muted); width: 40px; }
        .btn-remove-filter { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; margin-left: auto; }
        .btn-remove-filter:hover { color: var(--rose-500); }
        .btn-add-rule { background: transparent; border: none; color: var(--text-muted); cursor: pointer; text-align: left; font-size: .85rem; padding: 2px 0; width: fit-content; }
        .btn-add-rule:hover { color: var(--accent-500); }
        .hidden { display: none !important; }

        /* ============================================================
           viewXScroller — tabela full-bleed
        ============================================================ */
        .view-x-scroller {
            flex: 1 1 auto; min-width: 0; min-height: 0;   /* <- deixa o overflow do container agir */
            overflow: auto;                                 /* rola X e Y dentro do container */
        }
        table { table-layout: fixed; width: max-content; min-width: 100%; border-collapse: collapse; font-size: .9rem; }

        thead th {
            position: sticky; top: 0;
            text-align: left; font-weight: 500;
            color: var(--text-muted); font-size: .76rem; letter-spacing: .2px;
            padding: 9px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid var(--border); border-right: 1px solid var(--grid);
            background: var(--bg); z-index: 3;
        }
        thead th:first-child { padding-left: 18px; }
        th.add-col { cursor: pointer; text-align: center; color: var(--text-muted); font-size: 1rem; border-right: none; }
        th.add-col:hover { color: var(--accent-500); background: var(--secondary); }
        .filler-col { width: auto; }
        th.filler-th { border-right: none; background: var(--bg); }
        td.filler-td { border-right: none; }
        .col-resizer { position: absolute; top: 0; right: 0; width: 10px; height: 100%; cursor: col-resize; user-select: none; touch-action: none; z-index: 5; }
        thead th { position: sticky; }
        thead th > .col-resizer { position: absolute; }
        thead th { }

        tbody td {
            padding: 3px 10px; vertical-align: middle; height: 38px;
            border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid);
            overflow: hidden;
        }
        tbody td:first-child { padding-left: 18px; }
        tbody td.add-col-cell { border-right: none; }
        tbody tr:hover { background: color-mix(in srgb, var(--accent-400) 6%, transparent); }

        /* header precisa ser relative p/ posicionar a alça, e sticky ao mesmo tempo */
        thead th { position: sticky; }
        .th-wrap { position: relative; }

        .col-resizer::after { content: ""; position: absolute; right: 4px; top: 18%; height: 64%; width: 2px; border-radius: 2px; background: var(--border); opacity: 0; transition: opacity var(--transition), background var(--transition); }
        thead th:hover .col-resizer::after, .col-resizer.dragging::after { opacity: 1; background: var(--accent-500); }
        body.resizing { cursor: col-resize; user-select: none; }

        /* ---------- células ---------- */
        .cell-text {
            width: 100%; border: 1px solid transparent; background: transparent; color: var(--text);
            font: inherit; font-size: .9rem; padding: 5px 6px; border-radius: 5px; outline: none;
            transition: background var(--transition), box-shadow var(--transition);
        }
        .cell-text::placeholder { color: var(--text-muted); }
        .cell-text:hover { background: var(--secondary); }
        .cell-text:focus { background: var(--surface); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-400) 45%, transparent); }
        tbody td:first-child .cell-text { font-weight: 500; }
        tbody td:first-child .cell-text:hover { background: color-mix(in srgb, var(--secondary) 38%, transparent); }

        .cell-select {
            appearance: none; border: 1px solid transparent;
            padding: 3px 9px; border-radius: var(--radius-sm);
            font-size: .8rem; font-weight: 500; cursor: pointer; outline: none; max-width: 100%;
            transition: box-shadow var(--transition);
        }
        .cell-select:hover, .cell-select:focus-visible { box-shadow: var(--glow); }
        .cell-select {
            background: color-mix(in srgb, var(--chip, var(--c-grey-400)) var(--chip-bg-mix), transparent);
            color: var(--chip, var(--c-grey-500));
            border-color: color-mix(in srgb, var(--chip, var(--c-grey-400)) var(--chip-bd-mix), transparent);
        }
        [data-theme="dark"] .cell-select { color: color-mix(in srgb, var(--chip, var(--c-grey-400)) 45%, #ffffff); }
        .color-red    { --chip: var(--c-red-500); }
        .color-orange { --chip: var(--c-orange-500); }
        .color-yellow { --chip: var(--c-yellow-500); }
        .color-blue   { --chip: var(--c-blue-500); }
        .color-green  { --chip: var(--c-green-500); }
        .color-purple { --chip: var(--c-purple-500); }
        .color-grey   { --chip: var(--c-grey-500); }
        .color-transparent { background: transparent !important; color: var(--text-muted) !important; border: 1px dashed var(--grid) !important; box-shadow: none !important; }

        .cell-checkbox { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent-500); margin: 0; display: block; }
        .cell-date {
            background: transparent; border: 1px solid transparent; color: var(--text);
            font: inherit; font-size: .82rem; padding: 4px 5px; border-radius: 5px; outline: none; max-width: 100%;
            transition: background var(--transition), box-shadow var(--transition);
        }
        .cell-date:hover { background: var(--secondary); }
        .cell-date:focus { background: var(--surface); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-400) 45%, transparent); }

        .add-row {
            display: flex; align-items: center; gap: 8px;
            width: 100%; padding: 9px 18px; text-align: left;
            background: transparent; border: none; border-bottom: 1px solid var(--grid);
            color: var(--text-muted); font-size: .85rem; font-weight: 500; cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }
        .add-row:hover { background: var(--secondary); color: var(--text); }
        .add-row .plus { font-size: 1.05rem; line-height: 1; }

        .loading { padding: 20px; text-align: center; color: var(--text-muted); }

        /* ============================================================
           KANBAN
        ============================================================ */
        .view-kanban {
            flex: 1 1 auto; min-width: 0; min-height: 0;
            overflow: auto;                       /* rola horizontalmente quando há muitas colunas */
            display: flex; gap: 14px; align-items: flex-start;
            padding: 16px;
        }
        .kanban-empty { color: var(--text-muted); font-size: .9rem; padding: 40px; margin: auto; text-align: center; }
        .kanban-lane {
            flex: 0 0 288px; width: 288px; max-height: 100%;
            background: transparent; border: none; border-radius: var(--radius);
            display: flex; flex-direction: column;
            transition: width .32s cubic-bezier(.45,.05,.2,1), flex-basis .32s cubic-bezier(.45,.05,.2,1), box-shadow var(--transition);
        }
        .kanban-lane.drop-target { box-shadow: var(--glow); }
        .kanban-lane-head {

        /* ---------- células select/date como botões ---------- */

        /* ---------- página aberta ---------- */

        /* ---------- grid de blocos da página (estilo react-grid-layout) ---------- */
        .page-actions { margin-left: auto; flex: 0 0 auto; }
        .page-grid { position: relative; max-width: 90%; margin: 18px auto 0; min-height: 220px; }
        .grid-item { position: absolute; top: 0; left: 0; background: transparent; border: 1px solid transparent; border-radius: var(--radius); transition: left .22s cubic-bezier(.2,0,0,1), top .22s cubic-bezier(.2,0,0,1), width .22s cubic-bezier(.2,0,0,1), height .22s cubic-bezier(.2,0,0,1), box-shadow var(--transition), border-color var(--transition), background var(--transition); }
        .grid-item:hover { border-color: color-mix(in srgb, var(--border) 55%, transparent); }
        .page-grid.no-anim .grid-item, .page-grid.no-anim .grid-placeholder { transition: none; }
        .grid-item.dragging, .grid-item.resizing { transition: box-shadow var(--transition); z-index: 40; background: var(--surface); border-color: var(--border); box-shadow: 0 18px 44px -16px rgba(0,0,0,.5); cursor: grabbing; }
        .grid-item.dragging .block-editor, .grid-item.resizing .block-editor { pointer-events: none; }
        .grid-item.editing { background: var(--surface); border-color: var(--accent-400); box-shadow: var(--glow); z-index: 20; }
        .grid-placeholder { position: absolute; top: 0; left: 0; background: color-mix(in srgb, var(--accent-400) 13%, transparent); border: 1.5px dashed var(--accent-400); border-radius: var(--radius); transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease; display: none; }
        .grid-resize { position: absolute; right: 3px; bottom: 3px; width: 15px; height: 15px; cursor: nwse-resize; opacity: 0; transition: opacity var(--transition); border-right: 2.5px solid var(--text-muted); border-bottom: 2.5px solid var(--text-muted); border-bottom-right-radius: 6px; }
        .grid-item:hover .grid-resize { opacity: .8; }
        .grid-del { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: .78rem; line-height: 1; cursor: pointer; opacity: 0; transition: opacity var(--transition), color var(--transition); z-index: 5; }
        .grid-item:hover .grid-del { opacity: 1; }
        .grid-del:hover { color: var(--rose-500); border-color: var(--rose-400); }
        .block-editor { height: 100%; overflow-y: auto; padding: 12px 14px; outline: none; font-size: .92rem; line-height: 1.6; color: var(--text); cursor: text; user-select: text; }

        .block-editor td, .block-editor th { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 6px 9px; font-size: .86rem; min-width: 48px; }
        .block-editor tr td:last-child { border-right: none; }
        .block-editor tr:last-child td { border-bottom: none; }
        .mk { border-radius: 5px; padding: 1px 5px; box-decoration-break: clone; -webkit-box-decoration-break: clone; background: color-mix(in srgb, var(--chip, var(--c-grey-500)) var(--chip-bg-mix), transparent); color: color-mix(in srgb, var(--chip, var(--c-grey-500)) 85%, var(--text)); }
        [data-theme="dark"] .mk { color: color-mix(in srgb, var(--chip, var(--c-grey-500)) 55%, #ffffff); }
        .block-editor ul, .block-editor ol { margin: .3em 0; padding-left: 1.4em; }
        .block-editor li { margin: .12em 0; }
        .block-editor img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 8px 0; }
        .block-editor ul.cb-list { list-style: none; padding-left: .1em; }
        .block-editor ul.cb-list li.cb-item { display: flex; align-items: flex-start; gap: 8px; margin: .2em 0; }
        .cb-box { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px; border: 1.5px solid var(--border); border-radius: 5px; cursor: pointer; display: inline-grid; place-items: center; background: var(--surface); user-select: none; transition: background var(--transition), border-color var(--transition); }
        .cb-box::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); opacity: 0; }
        li.cb-item.checked .cb-box { background: var(--accent-500); border-color: var(--accent-500); }
        li.cb-item.checked .cb-box::after { opacity: 1; }

        const LS_KEY = 'cubs.dataview.v2';
        const DEFAULT_WIDTHS = { page_title: 280, text: 200, select: 170, checkbox: 110, date: 195, numeric: 150 };
        const PALETTE = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'grey'];

        let WORKING = null;
        let inMemoryOnly = false;
        let currentView = 'table';
        let dragRowId = null;

        const $ = id => document.getElementById(id);
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        /* ---------- Persistência ---------- */
        function loadWorking() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { inMemoryOnly = true; return null; } }
        function saveWorking() { try { localStorage.setItem(LS_KEY, JSON.stringify(WORKING)); } catch (e) { inMemoryOnly = true; } }
        function clearWorking() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

        /* ---------- Parser EAV ---------- */
        function parseTable(rawData) {
            const colsMap = new Map();
            colsMap.set('page_title', { id: 'page_title', name: 'Título da Página', type: 'text' });
            const rows = rawData.reduce((acc, item) => {
                let pageCols = item.page_columns;
                if (typeof pageCols === 'string') { try { pageCols = JSON.parse(pageCols); } catch (e) { pageCols = {}; } }
                const row = { id: item.page_id, page_title: item.page_title };
                if (pageCols && typeof pageCols === 'object') {
                    Object.entries(pageCols).forEach(([colId, colDef]) => {
                        if (!colsMap.has(colId)) {
                            let options = [];
                            if (colDef.column_type === 'select' && colDef.column_data) {
                                try { const cd = typeof colDef.column_data === 'string' ? JSON.parse(colDef.column_data) : colDef.column_data; options = cd.options || []; } catch (e) {}
                            }
                            colsMap.set(colId, { id: colId, name: colDef.column_name, type: colDef.column_type, options });
                        }
                        let cellData = {};
                        if (typeof colDef.row_data === 'string') { try { cellData = JSON.parse(colDef.row_data); } catch (e) {} }
                        else if (colDef.row_data) cellData = colDef.row_data;
                        if (colDef.column_type === 'date' && (cellData.startDate !== undefined || cellData.endDate !== undefined)) {
                            row[colId] = { startDate: cellData.startDate || null, endDate: cellData.endDate || null };
                        } else {
                            row[colId] = cellData.value !== undefined ? cellData.value : null;
                        }
                    });
                }
                acc.push(row);
                return acc;
            }, []);
            return { cols: Array.from(colsMap.values()), rows };
        }

        async function loadSeed() {
            try { const r = await fetch('./data.json', { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
            return INLINE_SEED;
        }

        /* ---------- Datas ---------- */
        function toLocalInput(iso) {
            if (!iso) return '';
            const d = new Date(String(iso).split('@')[0]);
            if (isNaN(d.getTime())) return '';
            return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        }
        function shortDate(iso) { const d = new Date(iso); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }); }
        function fmtDate(v) { const dv = dateVal(v); if (!dv) return ''; return dv.single ? shortDate(dv.start) : shortDate(dv.start) + ' → ' + shortDate(dv.end); }

        /* ============================================================
           Estado compartilhado / filtros
        ============================================================ */
        const cols = () => WORKING.cols;
        const selectCols = () => cols().filter(c => c.type === 'select');
        const colWidth = c => WORKING.widths[c.id] || DEFAULT_WIDTHS[c.id] || DEFAULT_WIDTHS[c.type] || 180;

        function getFilteredRows() {
            const filters = WORKING.ui.filters;
            let rows = WORKING.rows;
            if (filters.length) {
                rows = rows.filter(row => filters.every(f => {
                    if (!f.colId || f.value === null || f.value === '') return true;
                    const cv = row[f.colId], fv = f.value;
                    if (f.operator === 'equals') return String(cv).toLowerCase() === String(fv).toLowerCase();
                    if (f.operator === 'contains') return cv != null && String(cv).toLowerCase().includes(String(fv).toLowerCase());
                    return true;
                }));
            }
            return rows;
        }

        /* render de acordo com a visão ativa */
        function render() {
            if (currentView === 'kanban') { populateGroupBy(); renderKanban(); }
            else if (currentView === 'calendar') { populateCalDateCol(); renderCalendar(); }
            else applyFiltersAndRender();
        }

        /* ============================================================
           Render da TABELA
        ============================================================ */
        function applyFiltersAndRender() { renderTable(getFilteredRows()); }

        function renderTable(rows) {
            const C = cols();
            $('table-colgroup').innerHTML = `<col style="width:62px" />` + C.map(c => `<col data-col-id="${c.id}" style="width:${colWidth(c)}px" />`).join('') + `<col style="width:44px" /><col class="filler-col" />`;
            $('table-headers').innerHTML = `<th class="open-th"></th>` + C.map(c => `<th data-col-id="${c.id}" title="${esc(c.name)}"><div class="th-inner"><span class="th-label">${esc(c.name)}</span><button class="th-menu-btn" data-col-id="${c.id}" title="Opções da coluna">${ICON_DOTS}</button></div><span class="col-resizer" data-col-id="${c.id}"></span></th>`).join('') + `<th class="add-col" id="th-add-col" title="Nova coluna">+</th><th class="filler-th"></th>`;

            const body = $('table-body');
            if (!rows.length) { body.innerHTML = `<tr><td colspan="100%" class="loading">Nenhuma página. Use “+ Nova página”.</td></tr>`; return; }

            body.innerHTML = rows.map(row => {
                const cells = C.map(col => {
                    const v = row[col.id];
                    let html;
                    if (col.type === 'select') {
                        const sel = (col.options || []).find(o => o.id === v);
                        const cls = sel ? `color-${sel.color}` : 'color-transparent';
                        html = `<button type="button" class="cell-select cell-select-btn ${cls}" data-row-id="${row.id}" data-col-id="${col.id}">${sel ? esc(sel.value) : 'Vazio'}</button>`;
                    } else if (col.type === 'checkbox') {
                        html = `<div style="display:flex;align-items:center;"><input type="checkbox" class="cell-checkbox" data-row-id="${row.id}" data-col-id="${col.id}" ${v === true ? 'checked' : ''} /></div>`;
                    } else if (col.type === 'date') {
                        const dv = dateVal(v);
                        html = `<button type="button" class="cell-date-btn${dv ? '' : ' empty'}" data-row-id="${row.id}" data-col-id="${col.id}">${dv ? esc(fmtDate(v)) : 'Vazio'}</button>`;
                    } else {
                        const safe = (v == null ? '' : String(v)).replace(/"/g, '&quot;');
                        html = `<input type="text" class="cell-text" data-row-id="${row.id}" data-col-id="${col.id}" value="${safe}" placeholder="Vazio" />`;
                    }
                    return `<td class="type-${col.type}">${html}</td>`;
                }).join('');
                const openCell = `<td class="open-td"><a class="open-link" href="#" data-page="${row.id}" title="Abrir página">${ICON_OPEN} Abrir</a></td>`;
                return `<tr>${openCell}${cells}<td class="add-col-cell"></td><td class="filler-td"></td></tr>`;
            }).join('');
        }

        /* ============================================================
           Render do KANBAN
        ============================================================ */
        function populateGroupBy() {
            const sel = $('kanban-groupby');
            const sc = selectCols();
            if (!WORKING.ui.kanbanGroupBy || !sc.find(c => c.id === WORKING.ui.kanbanGroupBy)) WORKING.ui.kanbanGroupBy = sc[0]?.id || '';
            sel.innerHTML = sc.map(c => `<option value="${c.id}" ${c.id === WORKING.ui.kanbanGroupBy ? 'selected' : ''}>Agrupar: ${esc(c.name)}</option>`).join('');
            sel.classList.toggle('hidden', currentView !== 'kanban' || sc.length === 0);   // esconde o dropdown se não houver select
        }

        /* propriedades no card — mesmos controles da tabela */
        function cardProps(row, groupId) {
            return cols().filter(c => c.id !== 'page_title' && c.id !== groupId).map(col => {
                const v = row[col.id];
                let ctrl;
                if (col.type === 'select') {
                    const o = (col.options || []).find(x => x.id === v);
                    ctrl = `<button type="button" class="cell-select cell-select-btn ${o ? 'color-' + o.color : 'color-transparent'}" data-row-id="${row.id}" data-col-id="${col.id}">${o ? esc(o.value) : 'Vazio'}</button>`;
                } else if (col.type === 'checkbox') {
                    ctrl = `<input type="checkbox" class="cell-checkbox" data-row-id="${row.id}" data-col-id="${col.id}" ${v === true ? 'checked' : ''} />`;
                } else if (col.type === 'date') {
                    const dv = dateVal(v);
                    ctrl = `<button type="button" class="cell-date-btn${dv ? '' : ' empty'}" data-row-id="${row.id}" data-col-id="${col.id}">${dv ? esc(fmtDate(v)) : 'Vazio'}</button>`;
                } else {
                    ctrl = `<input type="text" class="cell-text" data-row-id="${row.id}" data-col-id="${col.id}" value="${(v == null ? '' : String(v)).replace(/"/g, '&quot;')}" placeholder="Vazio" />`;
                }
                return `<div class="kc-prop"><span class="kc-prop-name" title="${esc(col.name)}">${esc(col.name)}</span>${ctrl}</div>`;
            }).join('');
        }

        function cardMeta(row, groupId) {
            return cols().filter(c => c.id !== 'page_title' && c.id !== groupId).map(col => {
                const v = row[col.id];
                if (col.type === 'select') {
                    const o = (col.options || []).find(x => x.id === v);
                    return o ? `<span class="km-chip color-${o.color}">${esc(o.value)}</span>` : '';
                }
                if (col.type === 'checkbox') return v === true ? `<span class="km-flag">✓ ${esc(col.name)}</span>` : '';
                if (col.type === 'date') return v ? `<span class="km-flag">🗓 ${esc(fmtDate(v))}</span>` : '';
                return v ? `<span class="km-flag">${esc(v)}</span>` : '';
            }).filter(Boolean).join('');
        }

        function renderKanban() {
            const kan = $('view-kanban');
            const groupId = WORKING.ui.kanbanGroupBy;
            const groupCol = cols().find(c => c.id === groupId && c.type === 'select');
            if (!groupCol) {
                kan.innerHTML = `<div class="kanban-empty">O Kanban agrupa as páginas por uma coluna de <b>Seleção</b>.<br>Crie uma (ex.: “Status”) em <b>+ Coluna</b> para começar.</div>`;
                return;
            }
            const rows = getFilteredRows();
            const lanes = [...(groupCol.options || []), { id: '', value: 'Vazio', color: 'grey', _empty: true }];
            kan.innerHTML = lanes.map(lane => {
                const laneRows = rows.filter(r => (r[groupId] || '') === lane.id);
                const cards = laneRows.map(r => {
                    const title = `<input class="kanban-card-title-input" data-row-id="${r.id}" value="${esc(r.page_title || '')}" placeholder="Sem título" />`;
                    const props = cardProps(r, groupId);
                    return `<div class="kanban-card" draggable="true" data-row-id="${r.id}">${title}${props ? `<div class="kanban-card-props">${props}</div>` : ''}</div>`;
                }).join('');
                const collapsed = !!(WORKING.ui.kanbanCollapsed || {})[lane.id || '__empty'];
                const chipCls = lane._empty ? 'color-grey' : 'color-' + lane.color;
                return `<div class="kanban-lane ${collapsed ? 'collapsed' : ''} ${chipCls}" data-lane-id="${lane.id}">
                    <div class="kanban-lane-head" data-lane-toggle="${lane.id}"><span class="lane-chevron">${ICON_CHEV}</span><span class="kanban-lane-title">${lane._empty ? 'Vazio' : esc(lane.value)}</span><span class="kanban-lane-count">${laneRows.length}</span></div>
                    <div class="kanban-cards">${cards}</div>
                    <button class="kanban-add" data-lane-id="${lane.id}"><span>+</span> Nova página</button>
                </div>`;
            }).join('');
        }

        /* drag & drop do kanban */
        const kanEl = $('view-kanban');
        kanEl.addEventListener('dragstart', e => {
            if (e.target.closest('input, textarea, button')) { e.preventDefault(); return; }   // não arrastar ao editar campos do card
            const card = e.target.closest('.kanban-card'); if (!card) return;
            dragRowId = card.dataset.rowId; card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            try { e.dataTransfer.setData('text/plain', dragRowId); } catch (err) {}
        });
        kanEl.addEventListener('change', e => {
            const t = e.target;
            const row = WORKING.rows.find(r => r.id === t.dataset.rowId); if (!row) return;
            if (t.classList.contains('kanban-card-title-input')) row.page_title = t.value;
            else if (t.classList.contains('cell-checkbox')) row[t.dataset.colId] = t.checked;
            else if (t.classList.contains('cell-text')) row[t.dataset.colId] = t.value;
            else return;
            saveWorking();
        });
        kanEl.addEventListener('dragend', () => { kanEl.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging')); kanEl.querySelectorAll('.drop-target').forEach(l => l.classList.remove('drop-target')); dragRowId = null; });
        kanEl.addEventListener('dragover', e => { const lane = e.target.closest('.kanban-lane'); if (!lane || dragRowId == null) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (!lane.classList.contains('drop-target')) { kanEl.querySelectorAll('.drop-target').forEach(l => l.classList.remove('drop-target')); lane.classList.add('drop-target'); } });
        kanEl.addEventListener('drop', e => {
            const lane = e.target.closest('.kanban-lane'); if (!lane || dragRowId == null) return;
            e.preventDefault();
            const row = WORKING.rows.find(r => r.id === dragRowId);
            const gid = WORKING.ui.kanbanGroupBy;
            if (row && gid) { row[gid] = lane.dataset.laneId || null; saveWorking(); }
            dragRowId = null; renderKanban();
        });
        kanEl.addEventListener('click', e => {
            const toggle = e.target.closest('[data-lane-toggle]');
            if (toggle) {
                const key = toggle.dataset.laneToggle || '__empty';
                WORKING.ui.kanbanCollapsed = WORKING.ui.kanbanCollapsed || {};
                WORKING.ui.kanbanCollapsed[key] = !WORKING.ui.kanbanCollapsed[key];
                saveWorking();
                toggle.closest('.kanban-lane').classList.toggle('collapsed');
                return;
            }
            const sb = e.target.closest('.cell-select-btn'); if (sb) { closeDatePopover(); openSelectPopover(sb); return; }
            const db = e.target.closest('.cell-date-btn'); if (db) { closeSelectPopover(); openDatePopover(db); return; }
            const add = e.target.closest('.kanban-add'); if (!add) return;
            addPageWithStatus(WORKING.ui.kanbanGroupBy, add.dataset.laneId || null);
        });

        /* ============================================================
           Edição de células (tabela)
        ============================================================ */
        function onCellChange(e) {
            const el = e.target;
            const { rowId, colId } = el.dataset;
            if (!rowId || !colId) return;
            const row = WORKING.rows.find(r => r.id === rowId);
            if (!row) return;
            if (el.type === 'checkbox') row[colId] = el.checked;
            else if (el.matches('input.cell-text')) row[colId] = el.value;
            else return;
            saveWorking();
            if (colId === 'page_title') renderTabs();
        }
        $('table-body').addEventListener('change', onCellChange);

        /* ============================================================
           Datas: modelo (dia único = value ISO / intervalo = {startDate,endDate})
        ============================================================ */
        function dateVal(v) {
            if (!v) return null;
            if (typeof v === 'object') { const s = v.startDate || v.endDate, e = v.endDate || v.startDate; if (!s) return null; return { start: s, end: e, single: s === e }; }
            const str = String(v);
            if (str.includes('@')) { const [a, b] = str.split('@'); const s = a || b, e = b || a; return { start: s, end: e, single: !b || a === b }; }
            return { start: str, end: str, single: true };
        }
        const isoOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0).toISOString();

        function positionPopover(el, anchor) {
            const r = anchor.getBoundingClientRect();
            const ew = el.offsetWidth, eh = el.offsetHeight;
            let left = r.left; if (left + ew > window.innerWidth - 8) left = window.innerWidth - 8 - ew; if (left < 8) left = 8;
            let top = r.bottom + 4; if (top + eh > window.innerHeight - 8) top = Math.max(8, r.top - eh - 4);
            el.style.left = left + 'px'; el.style.top = top + 'px';
        }

        /* ============================================================
           Popover de SELEÇÃO (escolher valor + reordenar opções via splice)
        ============================================================ */
        let selPopCtx = null, spDragIdx = null;
        const selPop = $('select-popover');
        function openSelectPopover(btn) {
            const col = cols().find(c => c.id === btn.dataset.colId); if (!col) return;
            selPopCtx = { rowId: btn.dataset.rowId, colId: btn.dataset.colId };
            renderSelectPopover();
            selPop.classList.add('active');
            positionPopover(selPop, btn);

        function renderDatePopover() {

            if (lo && hi && hi < lo) { const t = lo; lo = hi; hi = t; }

                const d = new Date(gs); d.setDate(gs.getDate() + i); const df = dayFloor(d);
                const other = d.getMonth() !== dpM ? ' other' : '';

                if (lo && df.getTime() === lo.getTime()) cls += (hi && hi.getTime() !== lo.getTime()) ? ' start' : ' single';
                else if (hi && df.getTime() === hi.getTime()) cls += ' end';

        const dayFloor = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
        function eventRange(v) {
            const dv = dateVal(v); if (!dv) return null;
            const sd = new Date(dv.start); if (isNaN(sd.getTime())) return null;
            let ed = new Date(dv.end); if (isNaN(ed.getTime())) ed = sd;
            let a = dayFloor(sd), b = dayFloor(ed);
            if (b < a) { const t = a; a = b; b = t; }
            return { start: a, end: b, single: a.getTime() === b.getTime() };
        }
        function eventColor(row) {

        function renderCalendar() {
            const el = $('view-calendar');
            const colId = WORKING.ui.calDateCol;
            const dcol = cols().find(c => c.id === colId && c.type === 'date');
            if (!dcol) {
                el.innerHTML = `<div class="cal-empty">O calendário usa uma coluna de <b>Data</b>.<br>Crie uma (data única ou intervalo) em <b>+ Coluna → Data</b> e preencha as páginas para vê-las aqui.</div>`;
                return;
            }
            const Y = WORKING.ui.calY, M = WORKING.ui.calM;
            const gridStart = new Date(Y, M, 1 - new Date(Y, M, 1).getDay());   // recua até domingo
            const today = dayFloor(new Date());

            const events = [];
            getFilteredRows().forEach(r => { const rg = eventRange(r[colId]); if (rg) events.push({ row: r, start: rg.start, end: rg.end, single: rg.single, color: eventColor(r) }); });

            const MAXL = 3;
            let weeksHtml = '';
            for (let w = 0; w < 6; w++) {
                const weekStart = new Date(gridStart); weekStart.setDate(gridStart.getDate() + w * 7);
                const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
                const days = []; for (let d = 0; d < 7; d++) { const dd = new Date(weekStart); dd.setDate(weekStart.getDate() + d); days.push(dd); }

                // segmentos que cruzam esta semana (barra contínua por semana)
                const segs = [];
                events.forEach(ev => {
                    if (ev.end < weekStart || ev.start > weekEnd) return;
                    const s = ev.start < weekStart ? weekStart : ev.start;
                    const e = ev.end > weekEnd ? weekEnd : ev.end;
                    segs.push({ ev, colStart: Math.round((dayFloor(s) - dayFloor(weekStart)) / 864e5), colEnd: Math.round((dayFloor(e) - dayFloor(weekStart)) / 864e5) });
                });
                // atribui "faixas" (lanes) por agendamento guloso
                segs.sort((a, b) => a.colStart - b.colStart || (b.colEnd - b.colStart) - (a.colEnd - a.colStart));
                const lanes = [];
                segs.forEach(seg => {
                    let placed = false;
                    for (let li = 0; li < lanes.length; li++) {
                        if (lanes[li].every(o => seg.colStart > o.colEnd || seg.colEnd < o.colStart)) { lanes[li].push(seg); seg.lane = li; placed = true; break; }
                    }
                    if (!placed) { seg.lane = lanes.length; lanes.push([seg]); }
                });
                const hidden = [0, 0, 0, 0, 0, 0, 0];
                segs.forEach(seg => { if (seg.lane >= MAXL) for (let c = seg.colStart; c <= seg.colEnd; c++) hidden[c]++; });

                let cells = '';
                for (let d = 0; d < 7; d++) {
                    const dd = days[d];
                    const other = dd.getMonth() !== M ? ' other-month' : '';
                    const isToday = dayFloor(dd).getTime() === today.getTime() ? ' today' : '';
                    const more = hidden[d] > 0 ? `<span class="cal-more" data-cal-day="${dd.getFullYear()}-${dd.getMonth()}-${dd.getDate()}">+${hidden[d]} mais</span>` : '';
                    cells += `<div class="cal-day${other}${isToday}"><span class="cal-daynum">${dd.getDate()}</span>${more}</div>`;
                }
                let bars = '';
                segs.filter(s => s.lane < MAXL).forEach(seg => {
                    const t = seg.ev.row.page_title || '(Sem título)';
                    const cc = seg.ev.color ? ' color-' + seg.ev.color : '';
                    bars += `<div class="cal-ev${cc}" style="grid-column:${seg.colStart + 1} / span ${seg.colEnd - seg.colStart + 1};grid-row:${seg.lane + 1};" data-row-id="${seg.ev.row.id}" title="${esc(t)}">${esc(t)}</div>`;
                });
                weeksHtml += `<div class="cal-week"><div class="cal-week-bg">${cells}</div><div class="cal-events">${bars}</div></div>`;
            }

            el.innerHTML = `
                <div class="cal-head">
                    <div class="cal-title">${MONTHS[M]} ${Y}</div>
                    <div class="cal-nav"><button data-cal-nav="-1">‹</button><button class="cal-today" data-cal-nav="0">Hoje</button><button data-cal-nav="1">›</button></div>

        function openDayModal(key) {

        function pageState() {

        }
        function gridMetrics() { const gw = $('page-grid').clientWidth; return { gw, colW: (gw - GAP * (GRID_COLS - 1)) / GRID_COLS }; }
        function itemPx(l, colW) { return { left: Math.round(l.x * (colW + GAP)), top: l.y * (ROW_H + GAP), w: Math.round(l.w * colW + (l.w - 1) * GAP), h: l.h * ROW_H + (l.h - 1) * GAP }; }
        function collideL(a, b) { return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y); }
        function resolveLayout(layout, movingId) {
            let guard = 0, changed = true;
            while (changed && guard++ < 600) {
                changed = false;
                for (const a of layout) for (const b of layout) {
                    if (a === b || !collideL(a, b)) continue;
                    const push = a.i === movingId ? b : b.i === movingId ? a : (a.y <= b.y ? b : a);
                    const other = push === a ? b : a;
                    push.y = other.y + other.h; changed = true;
                }
            }
            const sorted = [...layout].sort((x, y) => x.y - y.y || x.x - y.x);
            for (const it of sorted) {
                if (it.i === movingId) continue;
                while (it.y > 0) { it.y--; if (layout.some(o => o !== it && collideL(it, o))) { it.y++; break; } }
            }

                if (l.i === skipId) return;
                const el = document.querySelector(`.grid-item[data-i="${l.i}"]`);
                if (!el) return;
                const p = itemPx(l, colW);
                el.style.width = p.w + 'px'; el.style.height = p.h + 'px';
                el.style.left = p.left + 'px'; el.style.top = p.top + 'px';

        }

                el.style.left = p.left + 'px'; el.style.top = p.top + 'px';

                el.innerHTML = `<div class="block-editor" contenteditable="false">${st.content[l.i] || ''}</div><span class="grid-resize" title="Redimensionar"></span><button type="button" class="grid-del" title="Remover bloco">✕</button>`;

            try {
                const sel = getSelection(); sel.removeAllRanges();
                const r = document.createRange(); r.setStart(node, index); r.setEnd(node, Math.min(index + 1, node.textContent.length)); r.deleteContents();
                const c = document.createRange(); c.setStart(node, index); c.collapse(true); sel.addRange(c);
            } catch (err) {}
            if (cmd === 'h1' || cmd === 'h2' || cmd === 'h3') document.execCommand('formatBlock', false, cmd.toUpperCase());
            else if (cmd === 'ul') document.execCommand('insertUnorderedList');
            else if (cmd === 'checkbox') insertChecklist();
            else if (cmd === 'table') document.execCommand('insertHTML', false, '<table><tbody><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table><p><br></p>');
            closeSlash(); saveActiveEditor();
        }
        $('view-page').addEventListener('input', e => {
            const ed = e.target.closest('.block-editor'); if (!ed || ed !== activeEditor) { closeSlash(); return; }
            const sel = getSelection(); if (!sel.rangeCount) { closeSlash(); return; }
            const node = sel.anchorNode, off = sel.anchorOffset;
            if (node && node.nodeType === 3 && off > 0 && node.textContent[off - 1] === '/' && (off === 1 || /\s|\u00a0/.test(node.textContent[off - 2]))) openSlash(node, off - 1);
            else closeSlash();
        });
        document.addEventListener('pointerdown', e => { if (e.target.closest('#slash-menu')) e.preventDefault(); }, true);
        document.addEventListener('click', e => {
            const opt = e.target.closest('#slash-menu .slash-opt');
            if (opt) { applySlash(opt.dataset.slash); return; }
            if (!e.target.closest('#slash-menu') && !e.target.closest('.block-editor')) closeSlash();
        });

        function initDock() {
            const wrap = $('dock-wrap'), dock = $('dock'), fab = $('dock-fab');
            if (!wrap) return;
            const items = [...dock.querySelectorAll('.dock-item')];
            const MAX = 0.44, SIGMA = 56;
            let closeTimer = null;
            const openDock = () => { clearTimeout(closeTimer); dock.classList.add('open'); };
            const closeDock = () => { closeTimer = setTimeout(() => { dock.classList.remove('open'); items.forEach(it => { it.style.transform = ''; it.classList.remove('tip-on'); }); }, 160); };
            fab.addEventListener('pointerenter', openDock);
            fab.addEventListener('pointerleave', closeDock);
            dock.addEventListener('pointerenter', openDock);
            dock.addEventListener('pointerleave', () => { items.forEach(it => { it.style.transform = ''; }); closeDock(); });
            dock.addEventListener('pointermove', e => {
                items.forEach(it => {
                    const r = it.getBoundingClientRect();
                    const d = e.clientX - (r.left + r.width / 2);
                    const s = 1 + MAX * Math.exp(-(d * d) / (2 * SIGMA * SIGMA));
                    it.style.transform = `translateY(${-(s - 1) * 20}px) scale(${s})`;
                });
            });
            let tipTimer = null;
            items.forEach(it => {
                it.addEventListener('pointerenter', () => { clearTimeout(tipTimer); items.forEach(o => o.classList.remove('tip-on')); tipTimer = setTimeout(() => it.classList.add('tip-on'), 520); });
                it.addEventListener('pointerleave', () => { clearTimeout(tipTimer); it.classList.remove('tip-on'); });
            });
            dock.addEventListener('click', e => {
                const item = e.target.closest('.dock-item'); if (!item) return;
                if (item.dataset.action === 'expand') { $('launcher').classList.add('active'); return; }
                if (item.classList.contains('disabled')) return;
                createBlock(item.dataset.block);
            });
            fab.addEventListener('click', () => createBlock('text'));
            const lo = $('launcher');
            lo.addEventListener('click', e => {
                if (e.target === lo) { lo.classList.remove('active'); return; }
                const tile = e.target.closest('.launcher-tile'); if (!tile || tile.classList.contains('disabled') || !tile.dataset.block) return;
                lo.classList.remove('active'); createBlock(tile.dataset.block);
            });
        }

        /* remover bloco */
        $('view-page').addEventListener('click', e => {
            const del = e.target.closest('.grid-del');
            if (del && currentPageId) {
                const item = del.closest('.grid-item');
                if (activeEditor && activeEditor.closest('.grid-item') === item) { activeEditor = null; $('bubble-menu').classList.remove('active'); }
                const st = pageState();
                st.layout = st.layout.filter(l => l.i !== item.dataset.i);
                delete st.content[item.dataset.i];
                resolveLayout(st.layout, null);
                saveWorking(); buildPageGrid();
            }
        });

        /* ============================================================
           Init
        ============================================================ */
        async function init() {
            const seed = await loadSeed();
            const parsed = parseTable(seed);
            const stored = loadWorking();
            if (stored && stored.version === 2) {
                WORKING = stored;
                WORKING.widths = WORKING.widths || {};
                WORKING.ui = Object.assign({ filters: [], theme: 'light', view: 'table', kanbanGroupBy: '', kanbanSort: 'default', calDateCol: '', tabs: [], activeTab: null, sidebarCollapsed: false }, WORKING.ui || {});
            } else {
                WORKING = { version: 2, cols: parsed.cols, rows: parsed.rows, widths: {}, ui: { filters: [], theme: 'light', view: 'table', kanbanGroupBy: '', kanbanSort: 'default', calDateCol: '', tabs: [], activeTab: null, sidebarCollapsed: false } };
                saveWorking();
            }
            WORKING.pages = WORKING.pages || {};
            applyTheme(WORKING.ui.theme);
            const now = new Date();
            if (WORKING.ui.calY == null) WORKING.ui.calY = now.getFullYear();
            if (WORKING.ui.calM == null) WORKING.ui.calM = now.getMonth();
            currentView = WORKING.ui.view || 'table';
            if (WORKING.ui.sidebarCollapsed) $('sidebar').classList.add('collapsed');
            renderFilterMenu();
            populateGroupBy();
            populateCalDateCol();
            renderTabs();
            showActiveTab();
        }
        init();
    </script>
</body>
</html>
