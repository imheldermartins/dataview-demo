<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cub's | DataView</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           PALETA BASE (Tailwind 300–500)
        ============================================================ */
        :root {
            --rose-300:#fda4af;   --rose-400:#fb7185;   --rose-500:#f43f5e;
            --sky-300:#7dd3fc;    --sky-400:#38bdf8;    --sky-500:#0ea5e9;
            --emerald-300:#6ee7b7;--emerald-400:#34d399;--emerald-500:#10b981;
            --yellow-300:#fde047; --yellow-400:#facc15; --yellow-500:#eab308;
            --orange-300:#fdba74; --orange-400:#fb923c; --orange-500:#f97316;
            --indigo-300:#a5b4fc; --indigo-400:#818cf8; --indigo-500:#6366f1;

            --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
            --slate-400:#94a3b8; --slate-500:#64748b; --slate-700:#334155;
            --slate-800:#1e293b; --slate-900:#0f172a; --slate-950:#020617;

            --c-red-500:var(--rose-500);       --c-red-400:var(--rose-400);
            --c-blue-500:var(--sky-500);       --c-blue-400:var(--sky-400);
            --c-green-500:var(--emerald-500);  --c-green-400:var(--emerald-400);
            --c-yellow-500:var(--yellow-500);  --c-yellow-400:var(--yellow-400);
            --c-orange-500:var(--orange-500);  --c-orange-400:var(--orange-400);
            --c-purple-500:var(--indigo-500);  --c-purple-400:var(--indigo-400);
            --c-grey-500:var(--slate-500);     --c-grey-400:var(--slate-400);

            --accent-300:var(--indigo-300);
            --accent-400:var(--indigo-400);
            --accent-500:var(--indigo-500);

            --radius:8px; --radius-sm:5px; --transition:.16s ease;
        }

        /* Tema claro */
        :root, [data-theme="light"] {
            --bg:        var(--slate-100);
            --surface:   #ffffff;
            --secondary: var(--slate-300);
            --border:    var(--slate-400);
            --text:      var(--slate-900);
            --text-muted:var(--slate-500);
            --chip-bg-mix:16%;
            --chip-bd-mix:34%;
        }
        /* Tema escuro */
        [data-theme="dark"] {
            --bg:        var(--slate-950);
            --surface:   var(--slate-900);
            --secondary: var(--slate-800);
            --border:    var(--slate-700);
            --text:      var(--slate-100);
            --text-muted:var(--slate-400);
            --chip-bg-mix:30%;
            --chip-bd-mix:48%;
        }
        :root {
            --grid: color-mix(in srgb, var(--border) 60%, transparent);
            --glow:
                0 0 0 1px color-mix(in srgb, var(--accent-500) 55%, transparent),
                0 8px 22px -10px color-mix(in srgb, var(--accent-500) 75%, transparent);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;          /* body não rola: as views são as regiões de scroll */
            transition: background-color var(--transition), color var(--transition);
        }

        /* ---------- navbar Cub's ---------- */
        .navbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; color: var(--text); }
        .brand-dot { width: 11px; height: 11px; border-radius: 3px; background: var(--accent-500); }
        .nav-actions { display: flex; gap: 6px; align-items: center; }

        /* ---------- Toolbar ---------- */
        .toolbar {
            flex: 0 0 auto; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 8px 14px; background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .toolbar-left { display: flex; align-items: center; gap: 10px; }
        .toolbar-right { display: flex; gap: 6px; align-items: center; position: relative; flex-wrap: wrap; justify-content: flex-end; }

        /* seletor de visão */
        .view-tabs { display: flex; gap: 2px; background: var(--secondary); padding: 3px; border-radius: 9px; }
        .view-tab {
            border: none; background: transparent; color: var(--text-muted);
            font-size: .82rem; font-weight: 600; padding: 5px 13px; border-radius: 6px;
            cursor: pointer; transition: background var(--transition), color var(--transition), box-shadow var(--transition);
        }
        .view-tab:hover { color: var(--text); }
        .view-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

        .btn {
            background: transparent; border: 1px solid transparent;
            padding: 6px 10px; border-radius: 6px;
            color: var(--text-muted); font-size: .85rem; font-weight: 500;
            cursor: pointer; outline: none;
            transition: background var(--transition), color var(--transition), box-shadow var(--transition), border-color var(--transition);
        }
        .btn:hover, .btn:focus-visible {
            background: var(--secondary); color: var(--text);
            border-color: var(--accent-400); box-shadow: var(--glow);
        }
        .icon-btn { padding: 6px 8px; line-height: 1; }

        .kanban-groupby {
            background: var(--secondary); border: 1px solid var(--border); color: var(--text);
            padding: 6px 9px; border-radius: 6px; font-size: .82rem; font-weight: 500; cursor: pointer; outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .kanban-groupby:focus { border-color: var(--accent-400); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-400) 28%, transparent); }

        /* ---------- Popovers ---------- */
        .popover {
            position: absolute; top: 42px; right: 0;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px;
            box-shadow: 0 14px 34px -12px rgba(0,0,0,.4);
            display: none; flex-direction: column; gap: 10px;
            z-index: 60; min-width: 300px; max-width: 92vw;
        }
        .popover.active { display: flex; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: .74rem; color: var(--text-muted); }
        .field input, .field select, .filter-rule select, .filter-rule input {
            background: var(--secondary); border: 1px solid var(--border); color: var(--text);
            padding: 7px 9px; border-radius: 6px; font-size: .85rem; outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .field input:focus, .field select:focus, .filter-rule select:focus, .filter-rule input:focus {
            border-color: var(--accent-400);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-400) 28%, transparent);
        }
        .btn-primary {
            background: var(--accent-500); color: #fff; border: none;
            padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: .85rem; cursor: pointer;
            transition: box-shadow var(--transition), filter var(--transition);
        }
        .btn-primary:hover { box-shadow: var(--glow); filter: brightness(1.05); }
        /* atalho roxo na toolbar */
        .btn-newpage { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; }
        .btn-newpage .plus { font-size: 1.05rem; line-height: 1; margin-top: -1px; }

        .filter-rule { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .filter-label { font-size: .82rem; color: var(--text-muted); width: 40px; }
        .btn-remove-filter { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; margin-left: auto; }
        .btn-remove-filter:hover { color: var(--rose-500); }
        .btn-add-rule { background: transparent; border: none; color: var(--text-muted); cursor: pointer; text-align: left; font-size: .85rem; padding: 2px 0; width: fit-content; }
        .btn-add-rule:hover { color: var(--accent-500); }
        .hidden { display: none !important; }

        /* ============================================================
           viewXScroller — tabela full-bleed
        ============================================================ */
        .view-x-scroller {
            flex: 1 1 auto; min-width: 0; min-height: 0;   /* <- deixa o overflow do container agir */
            overflow: auto;                                 /* rola X e Y dentro do container */
        }
        table { table-layout: fixed; width: max-content; min-width: 100%; border-collapse: collapse; font-size: .9rem; }

        thead th {
            position: sticky; top: 0;
            text-align: left; font-weight: 500;
            color: var(--text-muted); font-size: .76rem; letter-spacing: .2px;
            padding: 9px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid var(--border); border-right: 1px solid var(--grid);
            background: var(--bg); z-index: 3;
        }
        thead th:first-child { padding-left: 18px; }
        th.add-col { cursor: pointer; text-align: center; color: var(--text-muted); font-size: 1rem; border-right: none; }
        th.add-col:hover { color: var(--accent-500); background: var(--secondary); }
        .col-resizer { position: absolute; top: 0; right: 0; width: 10px; height: 100%; cursor: col-resize; user-select: none; touch-action: none; z-index: 5; }
        thead th { position: sticky; }
        thead th > .col-resizer { position: absolute; }
        thead th { }

        tbody td {
            padding: 3px 10px; vertical-align: middle; height: 38px;
            border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid);
            overflow: hidden;
        }
        tbody td:first-child { padding-left: 18px; }
        tbody td.add-col-cell { border-right: none; }
        tbody tr:hover { background: color-mix(in srgb, var(--accent-400) 6%, transparent); }

        /* header precisa ser relative p/ posicionar a alça, e sticky ao mesmo tempo */
        thead th { position: sticky; }
        .th-wrap { position: relative; }

        .col-resizer::after { content: ""; position: absolute; right: 4px; top: 18%; height: 64%; width: 2px; border-radius: 2px; background: var(--border); opacity: 0; transition: opacity var(--transition), background var(--transition); }
        thead th:hover .col-resizer::after, .col-resizer.dragging::after { opacity: 1; background: var(--accent-500); }
        body.resizing { cursor: col-resize; user-select: none; }

        /* ---------- células ---------- */
        .cell-text {
            width: 100%; border: 1px solid transparent; background: transparent; color: var(--text);
            font: inherit; font-size: .9rem; padding: 5px 6px; border-radius: 5px; outline: none;
            transition: background var(--transition), box-shadow var(--transition);
        }
        .cell-text::placeholder { color: var(--text-muted); }
        .cell-text:hover { background: var(--secondary); }
        .cell-text:focus { background: var(--surface); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-400) 45%, transparent); }
        tbody td:first-child .cell-text { font-weight: 500; }
        tbody td:first-child .cell-text:hover { background: color-mix(in srgb, var(--secondary) 38%, transparent); }

        .cell-select {
            appearance: none; border: 1px solid transparent;
            padding: 3px 9px; border-radius: var(--radius-sm);
            font-size: .8rem; font-weight: 500; cursor: pointer; outline: none; max-width: 100%;
            transition: box-shadow var(--transition);
        }
        .cell-select:hover, .cell-select:focus-visible { box-shadow: var(--glow); }
        .cell-select {
            background: color-mix(in srgb, var(--chip, var(--c-grey-400)) var(--chip-bg-mix), transparent);
            color: var(--chip, var(--c-grey-500));
            border-color: color-mix(in srgb, var(--chip, var(--c-grey-400)) var(--chip-bd-mix), transparent);
        }
        [data-theme="dark"] .cell-select { color: color-mix(in srgb, var(--chip, var(--c-grey-400)) 45%, #ffffff); }
        .color-red    { --chip: var(--c-red-500); }
        .color-orange { --chip: var(--c-orange-500); }
        .color-yellow { --chip: var(--c-yellow-500); }
        .color-blue   { --chip: var(--c-blue-500); }
        .color-green  { --chip: var(--c-green-500); }
        .color-purple { --chip: var(--c-purple-500); }
        .color-grey   { --chip: var(--c-grey-500); }
        .color-transparent { background: transparent !important; color: var(--text-muted) !important; border: 1px dashed var(--grid) !important; box-shadow: none !important; }

        .cell-checkbox { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent-500); margin: 0; display: block; }
        .cell-date {
            background: transparent; border: 1px solid transparent; color: var(--text);
            font: inherit; font-size: .82rem; padding: 4px 5px; border-radius: 5px; outline: none; max-width: 100%;
            transition: background var(--transition), box-shadow var(--transition);
        }
        .cell-date:hover { background: var(--secondary); }
        .cell-date:focus { background: var(--surface); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-400) 45%, transparent); }

        .add-row {
            display: flex; align-items: center; gap: 8px;
            width: 100%; padding: 9px 18px; text-align: left;
            background: transparent; border: none; border-bottom: 1px solid var(--grid);
            color: var(--text-muted); font-size: .85rem; font-weight: 500; cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }
        .add-row:hover { background: var(--secondary); color: var(--text); }
        .add-row .plus { font-size: 1.05rem; line-height: 1; }

        .loading { padding: 20px; text-align: center; color: var(--text-muted); }

        /* ============================================================
           KANBAN
        ============================================================ */
        .view-kanban {
            flex: 1 1 auto; min-width: 0; min-height: 0;
            overflow: auto;                       /* rola horizontalmente quando há muitas colunas */
            display: flex; gap: 14px; align-items: flex-start;
            padding: 16px;
        }
        .kanban-empty { color: var(--text-muted); font-size: .9rem; padding: 40px; margin: auto; text-align: center; }
        .kanban-lane {
            flex: 0 0 288px; width: 288px; max-height: 100%;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            display: flex; flex-direction: column;
            transition: box-shadow var(--transition), border-color var(--transition);
        }
        .kanban-lane.drop-target { border-color: var(--accent-400); box-shadow: var(--glow); }
        .kanban-lane-head {
            display: flex; align-items: center; gap: 8px;
            padding: 11px 12px 10px; border-bottom: 1px solid var(--grid); flex: 0 0 auto;
        }
        .kanban-lane-count { color: var(--text-muted); font-size: .78rem; font-weight: 600; }
        .kanban-cards {
            display: flex; flex-direction: column; gap: 8px;
            padding: 10px; overflow-y: auto; flex: 1 1 auto; min-height: 44px;
        }
        .kanban-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 10px 11px; cursor: grab;
            transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
        }
        .kanban-card:hover { border-color: var(--accent-400); box-shadow: 0 4px 12px -6px rgba(0,0,0,.35); }
        .kanban-card:active { cursor: grabbing; }
        .kanban-card.dragging { opacity: .4; }
        .kanban-card-title { font-weight: 600; font-size: .88rem; line-height: 1.3; color: var(--text); word-break: break-word; }
        .kanban-card-title.empty { color: var(--text-muted); font-weight: 500; font-style: italic; }
        .kanban-card-title-input { width: 100%; border: 1px solid transparent; background: transparent; color: var(--text); font-family: inherit; font-weight: 600; font-size: .88rem; line-height: 1.3; padding: 3px 5px; margin: -3px -5px; border-radius: 5px; outline: none; }
        .kanban-card-title-input::placeholder { color: var(--text-muted); font-style: italic; font-weight: 500; }
        .kanban-card-title-input:hover { background: var(--secondary); }
        .kanban-card-title-input:focus { background: var(--surface); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-400) 45%, transparent); cursor: text; }
        .kanban-card-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .km-chip { padding: 2px 8px; border-radius: var(--radius-sm); font-size: .74rem; font-weight: 500; border: 1px solid transparent; }
        .km-flag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: var(--radius-sm); font-size: .74rem; font-weight: 500; background: var(--secondary); color: var(--text-muted); }
        .kanban-add {
            display: flex; align-items: center; gap: 6px;
            margin: 0 10px 10px; padding: 7px 9px; width: calc(100% - 20px);
            background: transparent; border: 1px dashed var(--grid); border-radius: var(--radius-sm);
            color: var(--text-muted); font-size: .82rem; font-weight: 500; cursor: pointer;
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .kanban-add:hover { background: var(--secondary); color: var(--text); border-color: var(--accent-400); }

        /* ---------- ícone de filtro ---------- */
        #filter-count:empty { display: none; }
        #filter-count:not(:empty) { font-size: .72rem; font-weight: 700; color: var(--accent-500); }

        /* ---------- more-menu do cabeçalho ---------- */
        .th-inner { display: flex; align-items: center; gap: 6px; max-width: 100%; }
        .th-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .th-menu-btn { flex: 0 0 auto; opacity: 0; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 4px; padding: 2px 3px; line-height: 0; transition: opacity var(--transition), background var(--transition), color var(--transition); }
        thead th:hover .th-menu-btn, .th-menu-btn.on { opacity: 1; }
        .th-menu-btn:hover { background: var(--secondary); color: var(--text); }

        .col-menu { position: fixed; z-index: 200; width: 250px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 14px 34px -12px rgba(0,0,0,.45); padding: 12px; display: none; flex-direction: column; gap: 10px; }
        .col-menu.active { display: flex; }
        .col-menu label { font-size: .72rem; color: var(--text-muted); }
        .col-menu input { width: 100%; background: var(--secondary); border: 1px solid var(--border); color: var(--text); padding: 7px 9px; border-radius: 6px; font-size: .85rem; outline: none; }
        .col-menu input:focus { border-color: var(--accent-400); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-400) 28%, transparent); }
        .col-menu-del { display: flex; align-items: center; gap: 7px; background: transparent; border: none; color: var(--rose-500); font-size: .85rem; font-weight: 500; cursor: pointer; padding: 6px 4px; border-radius: 6px; text-align: left; }
        .col-menu-del:hover { background: color-mix(in srgb, var(--rose-500) 12%, transparent); }
        .col-menu-hint { font-size: .72rem; color: var(--text-muted); line-height: 1.4; }

        /* ---------- modal ---------- */
        .modal-overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--slate-950) 55%, transparent); display: none; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 420px; box-shadow: 0 24px 60px -16px rgba(0,0,0,.55); padding: 22px; }
        .modal h3 { margin: 0 0 10px; font-size: 1.05rem; }
        .modal p { margin: 0 0 4px; font-size: .9rem; color: var(--text-muted); line-height: 1.55; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; font-size: .85rem; font-weight: 500; cursor: pointer; }
        .btn-ghost:hover { background: var(--secondary); }
        .btn-danger { background: var(--rose-500); border: none; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: .85rem; font-weight: 600; cursor: pointer; }
        .btn-danger:hover { filter: brightness(1.05); }
        .day-modal { max-width: 460px; max-height: 80vh; display: flex; flex-direction: column; }
        .day-cards { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; margin-top: 6px; }
        .pm-list { display: flex; flex-direction: column; }
        .pm-row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: .86rem; align-items: center; }
        .pm-row:last-child { border-bottom: none; }
        .pm-key { flex: 0 0 40%; color: var(--text-muted); }
        .pm-val { flex: 1 1 auto; }

        /* ============================================================
           CALENDÁRIO
        ============================================================ */
        .view-calendar { flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; padding: 14px 16px; }
        .cal-empty { color: var(--text-muted); font-size: .9rem; padding: 40px; margin: auto; text-align: center; line-height: 1.6; }
        .cal-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex: 0 0 auto; }
        .cal-title { font-size: 1.1rem; font-weight: 700; text-transform: capitalize; min-width: 170px; }
        .cal-nav { display: flex; gap: 5px; }
        .cal-nav button { background: var(--secondary); border: 1px solid var(--border); color: var(--text); border-radius: 6px; cursor: pointer; font-size: .9rem; font-weight: 600; padding: 5px 11px; transition: box-shadow var(--transition), border-color var(--transition); }
        .cal-nav button.cal-today { font-size: .82rem; }
        .cal-nav button:hover { box-shadow: var(--glow); border-color: var(--accent-400); }
        .cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); flex: 0 0 auto; }
        .cal-weekday { padding: 6px 8px; font-size: .72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
        .cal-body { flex: 1 1 auto; min-height: 620px; display: flex; flex-direction: column; border-left: 1px solid var(--grid); border-top: 1px solid var(--grid); }
        .cal-week { position: relative; flex: 1 1 0; min-height: 108px; }
        .cal-week-bg { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); height: 100%; }
        .cal-day { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 4px 5px; position: relative; min-width: 0; overflow: hidden; }
        .cal-day.other-month { background: color-mix(in srgb, var(--secondary) 26%, transparent); }

        function parseTable(rawData) {
            const colsMap = new Map();
            colsMap.set('page_title', { id: 'page_title', name: 'Título da Página', type: 'text' });
            const rows = rawData.reduce((acc, item) => {
                let pageCols = item.page_columns;
                if (typeof pageCols === 'string') { try { pageCols = JSON.parse(pageCols); } catch (e) { pageCols = {}; } }
                const row = { id: item.page_id, page_title: item.page_title };
                if (pageCols && typeof pageCols === 'object') {
                    Object.entries(pageCols).forEach(([colId, colDef]) => {
                        if (!colsMap.has(colId)) {
                            let options = [];
                            if (colDef.column_type === 'select' && colDef.column_data) {
                                try { const cd = typeof colDef.column_data === 'string' ? JSON.parse(colDef.column_data) : colDef.column_data; options = cd.options || []; } catch (e) {}
                            }
                            colsMap.set(colId, { id: colId, name: colDef.column_name, type: colDef.column_type, options });
                        }
                        let cellData = {};
                        if (typeof colDef.row_data === 'string') { try { cellData = JSON.parse(colDef.row_data); } catch (e) {} }
                        else if (colDef.row_data) cellData = colDef.row_data;
                        if (colDef.column_type === 'date' && (cellData.startDate !== undefined || cellData.endDate !== undefined)) {
                            row[colId] = { startDate: cellData.startDate || null, endDate: cellData.endDate || null };
                        } else {
                            row[colId] = cellData.value !== undefined ? cellData.value : null;
                        }
                    });
                }
                acc.push(row);
                return acc;
            }, []);
            return { cols: Array.from(colsMap.values()), rows };
        }

        /* ---------- Datas ---------- */
        function toLocalInput(iso) {
            if (!iso) return '';
            const d = new Date(String(iso).split('@')[0]);
            if (isNaN(d.getTime())) return '';
            return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        }
        function shortDate(iso) { const d = new Date(iso); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }); }
        function fmtDate(v) { const dv = dateVal(v); if (!dv) return ''; return dv.single ? shortDate(dv.start) : shortDate(dv.start) + ' → ' + shortDate(dv.end); }

        /* ============================================================
           Estado compartilhado / filtros
        ============================================================ */
        const cols = () => WORKING.cols;
        const selectCols = () => cols().filter(c => c.type === 'select');
        const colWidth = c => WORKING.widths[c.id] || DEFAULT_WIDTHS[c.id] || DEFAULT_WIDTHS[c.type] || 180;

        function getFilteredRows() {
            const filters = WORKING.ui.filters;
            let rows = WORKING.rows;
            if (filters.length) {
                rows = rows.filter(row => filters.every(f => {
                    if (!f.colId || f.value === null || f.value === '') return true;
                    const cv = row[f.colId], fv = f.value;
                    if (f.operator === 'equals') return String(cv).toLowerCase() === String(fv).toLowerCase();
                    if (f.operator === 'contains') return cv != null && String(cv).toLowerCase().includes(String(fv).toLowerCase());
                    return true;
                }));
            }
            return rows;
        }

        /* render de acordo com a visão ativa */
        function render() {
            if (currentView === 'kanban') { populateGroupBy(); renderKanban(); }
            else if (currentView === 'calendar') { populateCalDateCol(); renderCalendar(); }
            else applyFiltersAndRender();
        }

        /* ============================================================
           Render da TABELA
        ============================================================ */
        function applyFiltersAndRender() { renderTable(getFilteredRows()); }

        function renderTable(rows) {
            const C = cols();
            $('table-colgroup').innerHTML = C.map(c => `<col data-col-id="${c.id}" style="width:${colWidth(c)}px" />`).join('') + `<col style="width:44px" />`;
            $('table-headers').innerHTML = C.map(c => `<th data-col-id="${c.id}" title="${esc(c.name)}"><div class="th-inner"><span class="th-label">${esc(c.name)}</span><button class="th-menu-btn" data-col-id="${c.id}" title="Opções da coluna">${ICON_DOTS}</button></div><span class="col-resizer" data-col-id="${c.id}"></span></th>`).join('') + `<th class="add-col" id="th-add-col" title="Nova coluna">+</th>`;

            const body = $('table-body');
            if (!rows.length) { body.innerHTML = `<tr><td colspan="100%" class="loading">Nenhuma página. Use “+ Nova página”.</td></tr>`; return; }

            body.innerHTML = rows.map(row => {
                const cells = C.map(col => {
                    const v = row[col.id];
                    let html;
                    if (col.type === 'select') {
                        const sel = (col.options || []).find(o => o.id === v);
                        const cls = sel ? `color-${sel.color}` : 'color-transparent';
                        html = `<button type="button" class="cell-select cell-select-btn ${cls}" data-row-id="${row.id}" data-col-id="${col.id}">${sel ? esc(sel.value) : 'Vazio'}</button>`;
                    } else if (col.type === 'checkbox') {
                        html = `<div style="display:flex;align-items:center;"><input type="checkbox" class="cell-checkbox" data-row-id="${row.id}" data-col-id="${col.id}" ${v === true ? 'checked' : ''} /></div>`;
                    } else if (col.type === 'date') {
                        const dv = dateVal(v);
                        html = `<button type="button" class="cell-date-btn${dv ? '' : ' empty'}" data-row-id="${row.id}" data-col-id="${col.id}">${dv ? esc(fmtDate(v)) : 'Vazio'}</button>`;
                    } else {
                        const safe = (v == null ? '' : String(v)).replace(/"/g, '&quot;');
                        html = `<input type="text" class="cell-text" data-row-id="${row.id}" data-col-id="${col.id}" value="${safe}" placeholder="Vazio" />`;
                    }
                    return `<td class="type-${col.type}">${html}</td>`;
                }).join('');
                return `<tr>${cells}<td class="add-col-cell"></td></tr>`;
            }).join('');
        }

        /* ============================================================
           Render do KANBAN
        ============================================================ */
        function populateGroupBy() {
            const sel = $('kanban-groupby');
            const sc = selectCols();
            if (!WORKING.ui.kanbanGroupBy || !sc.find(c => c.id === WORKING.ui.kanbanGroupBy)) WORKING.ui.kanbanGroupBy = sc[0]?.id || '';
            sel.innerHTML = sc.map(c => `<option value="${c.id}" ${c.id === WORKING.ui.kanbanGroupBy ? 'selected' : ''}>Agrupar: ${esc(c.name)}</option>`).join('');
        }

        function cardMeta(row, groupId) {
            return cols().filter(c => c.id !== 'page_title' && c.id !== groupId).map(col => {
                const v = row[col.id];
                if (col.type === 'select') {
                    const o = (col.options || []).find(x => x.id === v);
                    return o ? `<span class="km-chip color-${o.color}">${esc(o.value)}</span>` : '';
                }
                if (col.type === 'checkbox') return v === true ? `<span class="km-flag">✓ ${esc(col.name)}</span>` : '';
                if (col.type === 'date') return v ? `<span class="km-flag">🗓 ${esc(fmtDate(v))}</span>` : '';
                return v ? `<span class="km-flag">${esc(v)}</span>` : '';
            }).filter(Boolean).join('');
        }

        function renderKanban() {
            const kan = $('view-kanban');
            const groupId = WORKING.ui.kanbanGroupBy;
            const groupCol = cols().find(c => c.id === groupId && c.type === 'select');
            if (!groupCol) {
                kan.innerHTML = `<div class="kanban-empty">O Kanban agrupa as páginas por uma coluna de <b>Seleção</b>.<br>Crie uma (ex.: “Status”) em <b>+ Coluna</b> para começar.</div>`;
                return;
            }
            const rows = getFilteredRows();
            const lanes = [...(groupCol.options || []), { id: '', value: 'Vazio', color: 'grey', _empty: true }];
            kan.innerHTML = lanes.map(lane => {
                const laneRows = rows.filter(r => (r[groupId] || '') === lane.id);
                const cards = laneRows.map(r => {
                    const title = `<input class="kanban-card-title-input" data-row-id="${r.id}" value="${esc(r.page_title || '')}" placeholder="Sem título" />`;
                    const meta = cardMeta(r, groupId);
                    return `<div class="kanban-card" draggable="true" data-row-id="${r.id}">${title}${meta ? `<div class="kanban-card-meta">${meta}</div>` : ''}</div>`;
                }).join('');
                const chip = lane._empty ? `<span class="km-chip color-transparent">Vazio</span>` : `<span class="km-chip color-${lane.color}">${esc(lane.value)}</span>`;
                return `<div class="kanban-lane" data-lane-id="${lane.id}">
                    <div class="kanban-lane-head">${chip}<span class="kanban-lane-count">${laneRows.length}</span></div>
                    <div class="kanban-cards">${cards}</div>
                    <button class="kanban-add" data-lane-id="${lane.id}"><span>+</span> Nova página</button>
                </div>`;
            }).join('');
        }

        /* drag & drop do kanban */
        const kanEl = $('view-kanban');
        kanEl.addEventListener('dragstart', e => {
            if (e.target.closest('input, textarea')) { e.preventDefault(); return; }   // não arrastar ao editar o título
            const card = e.target.closest('.kanban-card'); if (!card) return;
            dragRowId = card.dataset.rowId; card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            try { e.dataTransfer.setData('text/plain', dragRowId); } catch (err) {}
        });
        kanEl.addEventListener('change', e => {
            const inp = e.target.closest('.kanban-card-title-input'); if (!inp) return;
            const row = WORKING.rows.find(r => r.id === inp.dataset.rowId);
            if (row) { row.page_title = inp.value; saveWorking(); }
        });
        kanEl.addEventListener('dragend', () => { kanEl.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging')); kanEl.querySelectorAll('.drop-target').forEach(l => l.classList.remove('drop-target')); dragRowId = null; });
        kanEl.addEventListener('dragover', e => { const lane = e.target.closest('.kanban-lane'); if (!lane || dragRowId == null) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (!lane.classList.contains('drop-target')) { kanEl.querySelectorAll('.drop-target').forEach(l => l.classList.remove('drop-target')); lane.classList.add('drop-target'); } });
        kanEl.addEventListener('drop', e => {
            const lane = e.target.closest('.kanban-lane'); if (!lane || dragRowId == null) return;
            e.preventDefault();
            const row = WORKING.rows.find(r => r.id === dragRowId);
            const gid = WORKING.ui.kanbanGroupBy;
            if (row && gid) { row[gid] = lane.dataset.laneId || null; saveWorking(); }
            dragRowId = null; renderKanban();
        });
        kanEl.addEventListener('click', e => {
            const add = e.target.closest('.kanban-add'); if (!add) return;
            addPageWithStatus(WORKING.ui.kanbanGroupBy, add.dataset.laneId || null);
        });

        /* ============================================================
           Edição de células (tabela)
        ============================================================ */
        function onCellChange(e) {
            const el = e.target;
            const { rowId, colId } = el.dataset;
            if (!rowId || !colId) return;
            const row = WORKING.rows.find(r => r.id === rowId);
            if (!row) return;
            if (el.type === 'checkbox') row[colId] = el.checked;
            else if (el.matches('input.cell-text')) row[colId] = el.value;
            else return;
            saveWorking();
        }
        $('table-body').addEventListener('change', onCellChange);

        /* ============================================================
           Datas: modelo (dia único = value ISO / intervalo = {startDate,endDate})
        ============================================================ */
        function dateVal(v) {
            if (!v) return null;
            if (typeof v === 'object') { const s = v.startDate || v.endDate, e = v.endDate || v.startDate; if (!s) return null; return { start: s, end: e, single: s === e }; }
            const str = String(v);
            if (str.includes('@')) { const [a, b] = str.split('@'); const s = a || b, e = b || a; return { start: s, end: e, single: !b || a === b }; }
            return { start: str, end: str, single: true };
        }
        const isoOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0).toISOString();

        function positionPopover(el, anchor) {
            const r = anchor.getBoundingClientRect();
            const ew = el.offsetWidth, eh = el.offsetHeight;
            let left = r.left; if (left + ew > window.innerWidth - 8) left = window.innerWidth - 8 - ew; if (left < 8) left = 8;
            let top = r.bottom + 4; if (top + eh > window.innerHeight - 8) top = Math.max(8, r.top - eh - 4);
            el.style.left = left + 'px'; el.style.top = top + 'px';
        }

        /* ============================================================
           Popover de SELEÇÃO (escolher valor + reordenar opções via splice)
        ============================================================ */
        let selPopCtx = null, spDragIdx = null;
        const selPop = $('select-popover');
        function openSelectPopover(btn) {
            const col = cols().find(c => c.id === btn.dataset.colId); if (!col) return;
            selPopCtx = { rowId: btn.dataset.rowId, colId: btn.dataset.colId };
            renderSelectPopover();
            selPop.classList.add('active');
            positionPopover(selPop, btn);
        }
        function closeSelectPopover() { selPop.classList.remove('active'); selPopCtx = null; }
        function renderSelectPopover() {
            if (!selPopCtx) return;
            const col = cols().find(c => c.id === selPopCtx.colId); if (!col) return;
            const row = WORKING.rows.find(r => r.id === selPopCtx.rowId);
            const cur = row ? row[selPopCtx.colId] : null;
            const opts = (col.options || []).map((o, i) => `<div class="sp-opt${o.id === cur ? ' sel' : ''}" draggable="true" data-opt-id="${o.id}" data-idx="${i}"><span class="sp-drag" title="Arraste para reordenar">⠿</span><span class="km-chip color-${o.color}">${esc(o.value)}</span>${o.id === cur ? '<span class="sp-check">✓</span>' : ''}</div>`).join('');
            selPop.innerHTML = `<div class="sp-head">${esc(col.name)}</div><div class="sp-list">${opts || '<div style="padding:6px;color:var(--text-muted);font-size:.8rem">Sem opções.</div>'}</div><button class="sp-clear" data-opt-id="">Limpar seleção</button>`;
        }
        function setSelectValue(optId) {
            if (!selPopCtx) return;
            const row = WORKING.rows.find(r => r.id === selPopCtx.rowId);
            if (row) { row[selPopCtx.colId] = optId || null; saveWorking(); }
            closeSelectPopover(); render();
        }
        selPop.addEventListener('click', e => {
            e.stopPropagation();
            if (e.target.closest('.sp-drag')) return;
            const opt = e.target.closest('.sp-opt'); if (opt) { setSelectValue(opt.dataset.optId); return; }
            if (e.target.closest('.sp-clear')) setSelectValue('');
        });
        selPop.addEventListener('dragstart', e => { const el = e.target.closest('.sp-opt'); if (!el) return; spDragIdx = +el.dataset.idx; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
        selPop.addEventListener('dragover', e => {
            const el = e.target.closest('.sp-opt'); if (!el || spDragIdx == null) return; e.preventDefault();
            selPop.querySelectorAll('.drop-above,.drop-below').forEach(x => x.classList.remove('drop-above', 'drop-below'));
            const r = el.getBoundingClientRect();
            el.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-above' : 'drop-below');
        });
        selPop.addEventListener('drop', e => {
            const el = e.target.closest('.sp-opt'); if (!el || spDragIdx == null) return; e.preventDefault();
            const r = el.getBoundingClientRect();
            let target = (+el.dataset.idx) + (e.clientY < r.top + r.height / 2 ? 0 : 1);
            const arr = cols().find(c => c.id === selPopCtx.colId).options;   // splice: remove do índice antigo e insere no novo
            const [moved] = arr.splice(spDragIdx, 1);
            if (spDragIdx < target) target--;
            arr.splice(target, 0, moved);
            saveWorking(); spDragIdx = null; renderSelectPopover(); render();
        });
        selPop.addEventListener('dragend', () => { spDragIdx = null; selPop.querySelectorAll('.dragging,.drop-above,.drop-below').forEach(x => x.classList.remove('dragging', 'drop-above', 'drop-below')); });

        /* ============================================================
           Popover de DATA (intervalo dinâmico início → fim, seleção de dias)
        ============================================================ */
        let dpCtx = null, dpY = 0, dpM = 0, dpStart = null, dpEnd = null, dpHover = null, dpHoverKey = '';
        const datePop = $('date-popover');
        function openDatePopover(btn) {
            dpCtx = { rowId: btn.dataset.rowId, colId: btn.dataset.colId };
            const row = WORKING.rows.find(r => r.id === dpCtx.rowId);
            const rg = row ? eventRange(row[dpCtx.colId]) : null;
            if (rg) { dpStart = rg.start; dpEnd = rg.single ? null : rg.end; dpY = rg.start.getFullYear(); dpM = rg.start.getMonth(); }
            else { dpStart = null; dpEnd = null; const n = new Date(); dpY = n.getFullYear(); dpM = n.getMonth(); }
            dpHover = null; dpHoverKey = '';
            renderDatePopover();
            datePop.classList.add('active');
            positionPopover(datePop, btn);
        }
        function closeDatePopover() { datePop.classList.remove('active'); dpCtx = null; }
        function renderDatePopover() {
            const gs = new Date(dpY, dpM, 1 - new Date(dpY, dpM, 1).getDay());
            let lo = dpStart ? dayFloor(dpStart) : null;
            let hi = dpEnd ? dayFloor(dpEnd) : (dpStart && dpHover ? dayFloor(dpHover) : null);
            if (lo && hi && hi < lo) { const t = lo; lo = hi; hi = t; }
            let cells = '';
            for (let i = 0; i < 42; i++) {
                const d = new Date(gs); d.setDate(gs.getDate() + i); const df = dayFloor(d);
                const other = d.getMonth() !== dpM ? ' other' : '';
                let cls = '';
                if (lo && df.getTime() === lo.getTime()) cls += (hi && hi.getTime() !== lo.getTime()) ? ' start' : ' single';
                else if (hi && df.getTime() === hi.getTime()) cls += ' end';
                else if (lo && hi && df > lo && df < hi) cls += ' mid';
                cells += `<button type="button" class="dp-day${other}${cls}" data-d="${d.getFullYear()}-${d.getMonth()}-${d.getDate()}">${d.getDate()}</button>`;
            }
            const selTxt = dpStart ? (dpEnd ? shortDate(isoOf(dpStart)) + ' → ' + shortDate(isoOf(dpEnd)) : shortDate(isoOf(dpStart)) + ' · dia único') : 'Nenhuma data';
            datePop.innerHTML = `<div class="dp-head"><button type="button" class="dp-nav" data-dp-nav="-1">‹</button><span class="dp-title">${MONTHS[dpM]} ${dpY}</span><button type="button" class="dp-nav" data-dp-nav="1">›</button></div><div class="dp-weekdays">${WD.map(w => `<span>${w[0].toUpperCase()}</span>`).join('')}</div><div class="dp-grid">${cells}</div><div class="dp-foot"><span class="dp-sel">${selTxt}</span><div class="dp-actions"><button type="button" class="dp-clear">Limpar</button><button type="button" class="dp-apply">Aplicar</button></div></div>`;
        }
        function commitDate() {
            if (!dpCtx) return;
            const row = WORKING.rows.find(r => r.id === dpCtx.rowId); if (!row) return;
            if (dpStart && dpEnd) { let s = dpStart, e = dpEnd; if (dayFloor(e) < dayFloor(s)) { const t = s; s = e; e = t; } row[dpCtx.colId] = { startDate: isoOf(s), endDate: isoOf(e) }; }
            else if (dpStart) row[dpCtx.colId] = isoOf(dpStart);
            else row[dpCtx.colId] = null;
            saveWorking(); render();
        }
        datePop.addEventListener('click', e => {
            e.stopPropagation();
            const nav = e.target.closest('[data-dp-nav]');
            if (nav) { let m = dpM + (+nav.dataset.dpNav); if (m < 0) { m = 11; dpY--; } if (m > 11) { m = 0; dpY++; } dpM = m; renderDatePopover(); return; }
            const day = e.target.closest('.dp-day');
            if (day) {
                const [y, m, d] = day.dataset.d.split('-').map(Number); const picked = new Date(y, m, d);
                if (!dpStart || (dpStart && dpEnd)) { dpStart = picked; dpEnd = null; }
                else { if (dayFloor(picked) < dayFloor(dpStart)) { dpStart = picked; dpEnd = null; } else dpEnd = picked; }
                dpHover = null; dpHoverKey = ''; renderDatePopover(); return;
            }
            if (e.target.closest('.dp-clear')) { dpStart = null; dpEnd = null; renderDatePopover(); return; }
            if (e.target.closest('.dp-apply')) { commitDate(); closeDatePopover(); return; }
        });
        datePop.addEventListener('mouseover', e => {
            const day = e.target.closest('.dp-day'); if (!day || !dpStart || dpEnd) return;
            if (day.dataset.d === dpHoverKey) return;
            dpHoverKey = day.dataset.d; const [y, m, d] = day.dataset.d.split('-').map(Number); dpHover = new Date(y, m, d); renderDatePopover();
        });

        /* abrir popover ao clicar na célula (select/date) + fechar ao clicar fora */
        $('table-body').addEventListener('click', e => {
            const sb = e.target.closest('.cell-select-btn'); if (sb) { closeDatePopover(); openSelectPopover(sb); return; }
            const db = e.target.closest('.cell-date-btn'); if (db) { closeSelectPopover(); openDatePopover(db); return; }
        });
        document.addEventListener('click', e => {
            const path = e.composedPath();   // capturado no dispatch: sobrevive ao re-render (innerHTML) dos popovers
            if (!path.includes(selPop) && !e.target.closest('.cell-select-btn')) closeSelectPopover();
            if (!path.includes(datePop) && !e.target.closest('.cell-date-btn')) closeDatePopover();
        });

        /* ============================================================
           Nova página / Nova coluna
        ============================================================ */
        function blankRow() {
            const row = { id: uid(), page_title: '' };
            cols().forEach(c => { if (c.id !== 'page_title') row[c.id] = c.type === 'checkbox' ? false : null; });
            return row;
        }
        function addPage() {
            WORKING.rows.push(blankRow());
            saveWorking();
            render();
            if (currentView === 'table') {
                const input = document.querySelector(`#table-body tr:last-child .cell-text[data-col-id="page_title"]`);
                if (input) input.focus();
            }
        }
        function addPageWithStatus(gid, laneId) {
            const row = blankRow();
            if (gid) row[gid] = laneId || null;
            WORKING.rows.push(row);
            saveWorking();
            renderKanban();
        }
        $('btn-add-page').addEventListener('click', addPage);
        $('btn-new-page-top').addEventListener('click', addPage);

        function addColumn() {
            const name = $('addcol-name').value.trim();
            const type = $('addcol-type').value;
            if (!name) { $('addcol-name').focus(); return; }
            const col = { id: 'col_' + uid(), name: uniqueColName(name), type };
            if (type === 'select') {
                const raw = $('addcol-options').value.split(',').map(s => s.trim()).filter(Boolean);
                col.options = raw.map((value, i) => ({ id: 'opt_' + uid(), value, color: PALETTE[i % PALETTE.length] }));
            }
            WORKING.cols.push(col);
            WORKING.rows.forEach(r => { r[col.id] = type === 'checkbox' ? false : null; });
            saveWorking();
            $('addcol-menu').classList.remove('active');
            $('addcol-name').value = ''; $('addcol-options').value = ''; $('addcol-type').value = 'text'; $('addcol-options-field').classList.add('hidden');
            render();
        }
        $('btn-confirm-addcol').addEventListener('click', addColumn);
        $('addcol-type').addEventListener('change', e => $('addcol-options-field').classList.toggle('hidden', e.target.value !== 'select'));

        /* ============================================================
           Filtros
        ============================================================ */
        function filterValueInput(filterId, col) {
            if (!col) return '';
            const f = WORKING.ui.filters.find(x => x.id === filterId);
            const val = f.value || '';
            if (col.type === 'select') return `<select class="filter-value-input" data-filter-id="${filterId}"><option value="" disabled ${!val ? 'selected' : ''}>Selecione…</option>${(col.options || []).map(o => `<option value="${o.id}" ${val === o.id ? 'selected' : ''}>${esc(o.value)}</option>`).join('')}</select>`;
            if (col.type === 'checkbox') return `<select class="filter-value-input" data-filter-id="${filterId}"><option value="" disabled ${!val ? 'selected' : ''}>Selecione…</option><option value="true" ${String(val) === 'true' ? 'selected' : ''}>Sim</option><option value="false" ${String(val) === 'false' ? 'selected' : ''}>Não</option></select>`;
            return `<input type="text" class="filter-value-input" data-filter-id="${filterId}" value="${esc(val)}" placeholder="Texto…" />`;
        }
        function renderFilterMenu() {
            const c = $('filter-rules-container');
            const filters = WORKING.ui.filters;
            $('filter-count').textContent = filters.length ? `(${filters.length})` : '';
            if (!filters.length) { c.innerHTML = '<span style="font-size:.85rem;color:var(--text-muted);">Nenhum filtro aplicado.</span>'; return; }
            c.innerHTML = filters.map((f, i) => {
                const col = cols().find(x => x.id === f.colId);
                let ops = `<option value="equals" ${f.operator === 'equals' ? 'selected' : ''}>Igual</option>`;
                if (!col || col.type === 'text') ops += `<option value="contains" ${f.operator === 'contains' ? 'selected' : ''}>Contém</option>`;
                return `<div class="filter-rule"><span class="filter-label">${i === 0 ? 'Onde' : 'E'}</span><select class="filter-col-select" data-filter-id="${f.id}" style="width:130px;"><option value="" disabled ${!f.colId ? 'selected' : ''}>Coluna…</option>${cols().filter(x => x.type !== 'date').map(x => `<option value="${x.id}" ${f.colId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select><select class="filter-operator-select" data-filter-id="${f.id}" style="width:96px;">${ops}</select>${filterValueInput(f.id, col)}<button class="btn-remove-filter" data-filter-id="${f.id}">×</button></div>`;
            }).join('');
        }
        $('btn-add-rule').addEventListener('click', () => { WORKING.ui.filters.push({ id: uid(), colId: '', operator: 'equals', value: '' }); renderFilterMenu(); saveWorking(); render(); });
        $('filter-rules-container').addEventListener('input', e => {
            const id = e.target.getAttribute('data-filter-id'); const f = WORKING.ui.filters.find(x => x.id === id); if (!f) return;
            if (e.target.classList.contains('filter-col-select')) { f.colId = e.target.value; f.value = ''; const t = cols().find(c => c.id === f.colId)?.type; if (t !== 'text' && f.operator === 'contains') f.operator = 'equals'; renderFilterMenu(); }
            else if (e.target.classList.contains('filter-operator-select')) f.operator = e.target.value;
            else if (e.target.classList.contains('filter-value-input')) f.value = e.target.value;
            saveWorking(); render();
        });
        $('filter-rules-container').addEventListener('click', e => {
            if (e.target.classList.contains('btn-remove-filter')) { const id = e.target.getAttribute('data-filter-id'); WORKING.ui.filters = WORKING.ui.filters.filter(x => x.id !== id); renderFilterMenu(); saveWorking(); render(); }
        });

        /* ============================================================
           Resize de colunas
        ============================================================ */
        let resize = null;
        $('table-headers').addEventListener('pointerdown', e => {
            const handle = e.target.closest('.col-resizer'); if (!handle) return;
            const colId = handle.dataset.colId;
            const colEl = document.querySelector(`#table-colgroup col[data-col-id="${colId}"]`);
            resize = { colId, colEl, startX: e.clientX, startW: colEl.getBoundingClientRect().width, handle };
            handle.classList.add('dragging'); document.body.classList.add('resizing'); handle.setPointerCapture(e.pointerId); e.preventDefault();
        });
        document.addEventListener('pointermove', e => { if (!resize) return; resize.colEl.style.width = Math.max(80, Math.round(resize.startW + (e.clientX - resize.startX))) + 'px'; });
        document.addEventListener('pointerup', () => { if (!resize) return; WORKING.widths[resize.colId] = parseInt(resize.colEl.style.width, 10); saveWorking(); resize.handle.classList.remove('dragging'); document.body.classList.remove('resizing'); resize = null; });

        /* ============================================================
           Visões, tema, reset, popovers
        ============================================================ */
        function setView(v) {
            currentView = v;
            document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === v));
            $('view-table').classList.toggle('hidden', v !== 'table');
            $('view-kanban').classList.toggle('hidden', v !== 'kanban');
            $('view-calendar').classList.toggle('hidden', v !== 'calendar');
            $('kanban-groupby').classList.toggle('hidden', v !== 'kanban');
            $('calendar-datecol').classList.toggle('hidden', v !== 'calendar');
            WORKING.ui.view = v; saveWorking();
            render();
        }
        $('view-tabs').addEventListener('click', e => { const b = e.target.closest('.view-tab'); if (b) setView(b.dataset.view); });
        $('kanban-groupby').addEventListener('change', e => { WORKING.ui.kanbanGroupBy = e.target.value; saveWorking(); renderKanban(); });

        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); $('btn-theme').textContent = t === 'dark' ? '☀️' : '🌙'; }
        $('btn-theme').addEventListener('click', () => { WORKING.ui.theme = WORKING.ui.theme === 'dark' ? 'light' : 'dark'; applyTheme(WORKING.ui.theme); saveWorking(); });
        $('btn-reset').addEventListener('click', () => { clearWorking(); location.reload(); });

        $('btn-toggle-filters').addEventListener('click', e => { e.stopPropagation(); $('addcol-menu').classList.remove('active'); $('filter-menu').classList.toggle('active'); });
        $('btn-toggle-addcol').addEventListener('click', e => { e.stopPropagation(); $('filter-menu').classList.remove('active'); $('addcol-menu').classList.toggle('active'); });
        document.addEventListener('click', e => {
            if (e.target.closest('#th-add-col')) { $('filter-menu').classList.remove('active'); $('addcol-menu').classList.add('active'); $('addcol-name').focus(); return; }
            if (!e.target.closest('#btn-toggle-filters') && !e.target.closest('#filter-menu')) $('filter-menu').classList.remove('active');
            if (!e.target.closest('#btn-toggle-addcol') && !e.target.closest('#addcol-menu') && !e.target.closest('#th-add-col')) $('addcol-menu').classList.remove('active');
        });

        /* ---------- ícones ---------- */
        const ICON_DOTS = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:block"><path d="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4Z"/></svg>';

        const dateCols = () => cols().filter(c => c.type === 'date');

        /* nome único por coluna (colisão vira "nome (N)") */
        function uniqueColName(name, exceptId) {
            const base = (name || '').trim() || 'Coluna';
            const taken = new Set(cols().filter(c => c.id !== exceptId).map(c => (c.name || '').toLowerCase()));
            if (!taken.has(base.toLowerCase())) return base;
            let n = 2;
            while (taken.has(`${base} (${n})`.toLowerCase())) n++;
            return `${base} (${n})`;
        }

        /* ============================================================
           Modal genérico
        ============================================================ */
        function showModal(html, cls) {
            const o = $('modal-root');
            const m = o.querySelector('.modal');
            m.className = 'modal' + (cls ? ' ' + cls : '');
            m.innerHTML = html;
            o.classList.add('active');
        }
        function closeModal() { $('modal-root').classList.remove('active'); }
        $('modal-root').addEventListener('click', e => {
            if (e.target === $('modal-root')) return closeModal();
            const card = e.target.closest('.kanban-card[data-row-id]');
            if (card) { openPageModal(card.dataset.rowId); return; }
            const a = e.target.closest('[data-action]'); if (!a) return;
            if (a.dataset.action === 'cancel') closeModal();
            else if (a.dataset.action === 'confirm-del') doDeleteColumn();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeColMenu(); closeSelectPopover(); closeDatePopover(); } });

        /* ============================================================
           More-menu do cabeçalho: renomear / excluir coluna
        ============================================================ */
        let colMenuId = null;
        function openColMenu(colId, btn) {
            const col = cols().find(c => c.id === colId); if (!col) return;
            colMenuId = colId;
            const isPrimary = colId === 'page_title';
            $('col-menu-name').value = col.name;
            $('col-menu-del').classList.toggle('hidden', isPrimary);
            $('col-menu-hint').textContent = isPrimary
                ? 'A coluna principal não pode ser excluída.'
                : 'Excluir remove esta propriedade de todas as páginas.';
            const menu = $('col-menu');
            menu.classList.add('active');
            const r = btn.getBoundingClientRect();
            let left = r.right - 250; if (left < 8) left = 8;
            menu.style.left = left + 'px';
            menu.style.top = (r.bottom + 6) + 'px';
            $('col-menu-name').focus(); $('col-menu-name').select();
        }
        function closeColMenu() { $('col-menu').classList.remove('active'); colMenuId = null; }

        $('col-menu-name').addEventListener('input', e => {
            const col = cols().find(c => c.id === colMenuId); if (!col) return;
            col.name = e.target.value;
            saveWorking();
            const lbl = document.querySelector(`th[data-col-id="${colMenuId}"] .th-label`);
            if (lbl) lbl.textContent = col.name;
        });
        function commitColName() {
            const col = cols().find(c => c.id === colMenuId); if (!col) return;
            col.name = uniqueColName(col.name, col.id);
            $('col-menu-name').value = col.name;
            saveWorking();
            renderFilterMenu(); render();
        }
        $('col-menu-name').addEventListener('change', commitColName);
        $('col-menu-name').addEventListener('keydown', e => { if (e.key === 'Enter') { commitColName(); closeColMenu(); } });

        let pendingDelId = null;
        $('col-menu-del').addEventListener('click', () => {
            const col = cols().find(c => c.id === colMenuId); if (!col) return;
            pendingDelId = colMenuId;
            showModal(`<h3>Excluir coluna</h3><p>Tem certeza que deseja excluir a coluna <b>“${esc(col.name)}”</b>?</p><p>Essa propriedade será removida de <b>todas as páginas</b> desta base de dados. Não é possível desfazer.</p><div class="modal-actions"><button class="btn-ghost" data-action="cancel">Cancelar</button><button class="btn-danger" data-action="confirm-del">Excluir coluna</button></div>`);
        });
        function doDeleteColumn() {
            const id = pendingDelId; if (!id) return;
            WORKING.cols = WORKING.cols.filter(c => c.id !== id);
            WORKING.rows.forEach(r => { delete r[id]; });
            WORKING.ui.filters = WORKING.ui.filters.filter(f => f.colId !== id);
            if (WORKING.ui.kanbanGroupBy === id) WORKING.ui.kanbanGroupBy = '';
            if (WORKING.ui.calDateCol === id) WORKING.ui.calDateCol = '';
            saveWorking();
            pendingDelId = null; closeModal(); closeColMenu();
            renderFilterMenu(); populateGroupBy(); populateCalDateCol(); render();
        }

        $('table-headers').addEventListener('click', e => {
            const btn = e.target.closest('.th-menu-btn'); if (!btn) return;
            e.stopPropagation();
            if (colMenuId === btn.dataset.colId && $('col-menu').classList.contains('active')) closeColMenu();
            else openColMenu(btn.dataset.colId, btn);
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('#col-menu') && !e.target.closest('.th-menu-btn')) closeColMenu();
        });

        /* ============================================================
           Ordenação do Kanban
        ============================================================ */
        /* (ordenação do Kanban removida — reordenação agora é por opção no popover de seleção) */

        /* ============================================================
           Detalhe de página (mostra as colunas no card)
        ============================================================ */
        function openPageModal(rowId) {
            const row = WORKING.rows.find(r => r.id === rowId); if (!row) return;
            const rows = cols().filter(c => c.id !== 'page_title').map(c => {
                const v = row[c.id]; let disp;
                if (c.type === 'select') { const o = (c.options || []).find(x => x.id === v); disp = o ? `<span class="km-chip color-${o.color}">${esc(o.value)}</span>` : '<span style="color:var(--text-muted)">—</span>'; }
                else if (c.type === 'checkbox') disp = v === true ? 'Sim' : 'Não';
                else if (c.type === 'date') disp = v ? esc(fmtDate(v)) : '<span style="color:var(--text-muted)">—</span>';
                else disp = v ? esc(v) : '<span style="color:var(--text-muted)">—</span>';
                return `<div class="pm-row"><span class="pm-key">${esc(c.name)}</span><span class="pm-val">${disp}</span></div>`;
            }).join('');
            showModal(`<h3>${esc(row.page_title || '(Sem título)')}</h3><div class="pm-list">${rows}</div><div class="modal-actions"><button class="btn-ghost" data-action="cancel">Fechar</button></div>`);
        }

        /* ============================================================
           CALENDÁRIO
        ============================================================ */
        const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
        const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

        function populateCalDateCol() {
            const sel = $('calendar-datecol');
            const dc = dateCols();
            if (!WORKING.ui.calDateCol || !dc.find(c => c.id === WORKING.ui.calDateCol)) WORKING.ui.calDateCol = dc[0]?.id || '';
            sel.innerHTML = dc.map(c => `<option value="${c.id}" ${c.id === WORKING.ui.calDateCol ? 'selected' : ''}>Data: ${esc(c.name)}</option>`).join('');
        }

        const dayFloor = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
        function eventRange(v) {
            const dv = dateVal(v); if (!dv) return null;
            const sd = new Date(dv.start); if (isNaN(sd.getTime())) return null;
            let ed = new Date(dv.end); if (isNaN(ed.getTime())) ed = sd;
            let a = dayFloor(sd), b = dayFloor(ed);
            if (b < a) { const t = a; a = b; b = t; }
            return { start: a, end: b, single: a.getTime() === b.getTime() };
        }
        function eventColor(row) {
            for (const c of selectCols()) { const o = (c.options || []).find(x => x.id === row[c.id]); if (o) return o.color; }
            return null;
        }

        function renderCalendar() {
            const el = $('view-calendar');
            const colId = WORKING.ui.calDateCol;
            const dcol = cols().find(c => c.id === colId && c.type === 'date');
            if (!dcol) {
                el.innerHTML = `<div class="cal-empty">O calendário usa uma coluna de <b>Data</b>.<br>Crie uma (data única ou intervalo) em <b>+ Coluna → Data</b> e preencha as páginas para vê-las aqui.</div>`;
                return;
            }
            const Y = WORKING.ui.calY, M = WORKING.ui.calM;
            const gridStart = new Date(Y, M, 1 - new Date(Y, M, 1).getDay());   // recua até domingo
            const today = dayFloor(new Date());

            const events = [];
            getFilteredRows().forEach(r => { const rg = eventRange(r[colId]); if (rg) events.push({ row: r, start: rg.start, end: rg.end, single: rg.single, color: eventColor(r) }); });

            const MAXL = 3;
            let weeksHtml = '';
            for (let w = 0; w < 6; w++) {
                const weekStart = new Date(gridStart); weekStart.setDate(gridStart.getDate() + w * 7);
                const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
                const days = []; for (let d = 0; d < 7; d++) { const dd = new Date(weekStart); dd.setDate(weekStart.getDate() + d); days.push(dd); }

                // segmentos que cruzam esta semana (barra contínua por semana)
                const segs = [];
                events.forEach(ev => {
                    if (ev.end < weekStart || ev.start > weekEnd) return;
                    const s = ev.start < weekStart ? weekStart : ev.start;
                    const e = ev.end > weekEnd ? weekEnd : ev.end;
                    segs.push({ ev, colStart: Math.round((dayFloor(s) - dayFloor(weekStart)) / 864e5), colEnd: Math.round((dayFloor(e) - dayFloor(weekStart)) / 864e5) });
                });
                // atribui "faixas" (lanes) por agendamento guloso
                segs.sort((a, b) => a.colStart - b.colStart || (b.colEnd - b.colStart) - (a.colEnd - a.colStart));
                const lanes = [];
                segs.forEach(seg => {
                    let placed = false;
                    for (let li = 0; li < lanes.length; li++) {
                        if (lanes[li].every(o => seg.colStart > o.colEnd || seg.colEnd < o.colStart)) { lanes[li].push(seg); seg.lane = li; placed = true; break; }
                    }
                    if (!placed) { seg.lane = lanes.length; lanes.push([seg]); }
                });
                const hidden = [0, 0, 0, 0, 0, 0, 0];
                segs.forEach(seg => { if (seg.lane >= MAXL) for (let c = seg.colStart; c <= seg.colEnd; c++) hidden[c]++; });

                let cells = '';
                for (let d = 0; d < 7; d++) {
                    const dd = days[d];
                    const other = dd.getMonth() !== M ? ' other-month' : '';
                    const isToday = dayFloor(dd).getTime() === today.getTime() ? ' today' : '';
                    const more = hidden[d] > 0 ? `<span class="cal-more" data-cal-day="${dd.getFullYear()}-${dd.getMonth()}-${dd.getDate()}">+${hidden[d]} mais</span>` : '';
                    cells += `<div class="cal-day${other}${isToday}"><span class="cal-daynum">${dd.getDate()}</span>${more}</div>`;
                }
                let bars = '';
                segs.filter(s => s.lane < MAXL).forEach(seg => {
                    const t = seg.ev.row.page_title || '(Sem título)';
                    const cc = seg.ev.color ? ' color-' + seg.ev.color : '';
                    bars += `<div class="cal-ev${cc}" style="grid-column:${seg.colStart + 1} / span ${seg.colEnd - seg.colStart + 1};grid-row:${seg.lane + 1};" data-row-id="${seg.ev.row.id}" title="${esc(t)}">${esc(t)}</div>`;
                });
                weeksHtml += `<div class="cal-week"><div class="cal-week-bg">${cells}</div><div class="cal-events">${bars}</div></div>`;
            }

            el.innerHTML = `
                <div class="cal-head">
                    <div class="cal-title">${MONTHS[M]} ${Y}</div>
                    <div class="cal-nav"><button data-cal-nav="-1">‹</button><button class="cal-today" data-cal-nav="0">Hoje</button><button data-cal-nav="1">›</button></div>
                </div>
                <div class="cal-weekdays">${WD.map(d => `<div class="cal-weekday">${d}</div>`).join('')}</div>
                <div class="cal-body">${weeksHtml}</div>`;
        }

        function openDayModal(key) {
            const [y, m, d] = key.split('-').map(Number);
            const day = dayFloor(new Date(y, m, d));
            const colId = WORKING.ui.calDateCol;
            const list = getFilteredRows().filter(r => { const rg = eventRange(r[colId]); return rg && day >= rg.start && day <= rg.end; });
            const cards = list.map(r => {
                const meta = cardMeta(r, null);
                const t = (r.page_title && r.page_title.trim()) ? esc(r.page_title) : '<span style="font-style:italic;color:var(--text-muted)">(Sem título)</span>';
                return `<div class="kanban-card" data-row-id="${r.id}"><div class="kanban-card-title">${t}</div>${meta ? `<div class="kanban-card-meta">${meta}</div>` : ''}</div>`;
            }).join('') || '<p style="margin:0;color:var(--text-muted)">Nada neste dia.</p>';
            showModal(`<h3>${d} de ${MONTHS[m]}</h3><div class="day-cards">${cards}</div><div class="modal-actions"><button class="btn-ghost" data-action="cancel">Fechar</button></div>`, 'day-modal');
        }

        $('view-calendar').addEventListener('click', e => {
            const nav = e.target.closest('[data-cal-nav]');
            if (nav) {
                const dir = +nav.dataset.calNav;
                if (dir === 0) { const n = new Date(); WORKING.ui.calY = n.getFullYear(); WORKING.ui.calM = n.getMonth(); }
                else { let m = WORKING.ui.calM + dir, y = WORKING.ui.calY; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } WORKING.ui.calM = m; WORKING.ui.calY = y; }
                saveWorking(); renderCalendar(); return;
            }
            const ev = e.target.closest('.cal-ev'); if (ev) { openPageModal(ev.dataset.rowId); return; }
            const more = e.target.closest('.cal-more'); if (more) { openDayModal(more.dataset.calDay); return; }
        });
        $('calendar-datecol').addEventListener('change', e => { WORKING.ui.calDateCol = e.target.value; saveWorking(); renderCalendar(); });

        /* ============================================================
           Init
        ============================================================ */
        async function init() {
            const seed = await loadSeed();
            const parsed = parseTable(seed);
            const stored = loadWorking();
            if (stored && stored.version === 2) {
                WORKING = stored;
                WORKING.widths = WORKING.widths || {};
                WORKING.ui = Object.assign({ filters: [], theme: 'light', view: 'table', kanbanGroupBy: '', kanbanSort: 'default', calDateCol: '' }, WORKING.ui || {});
            } else {
                WORKING = { version: 2, cols: parsed.cols, rows: parsed.rows, widths: {}, ui: { filters: [], theme: 'light', view: 'table', kanbanGroupBy: '', kanbanSort: 'default', calDateCol: '' } };
                saveWorking();
            }
            applyTheme(WORKING.ui.theme);
            const now = new Date();
            if (WORKING.ui.calY == null) WORKING.ui.calY = now.getFullYear();
            if (WORKING.ui.calM == null) WORKING.ui.calM = now.getMonth();
            renderFilterMenu();
            populateGroupBy();
            populateCalDateCol();
            setView(WORKING.ui.view || 'table');
        }
        init();
    </script>
</body>
